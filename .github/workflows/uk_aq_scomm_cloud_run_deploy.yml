# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Sensor.Community Cloud Run Job

on:
  push:
    branches:
      - main
    paths:
      - "workers/uk_aq_sensorcommunity_cloud_run/**"
      - "scripts/gcp/**"
      - ".github/workflows/uk_aq_scomm_cloud_run_deploy.yml"
  workflow_dispatch:

jobs:
  deploy-scomm-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO || 'uk-aq' }}
      JOB_NAME: ${{ vars.GCP_SCOMM_JOB_NAME || 'uk-aq-scomm-ingest' }}
      GCP_SCOMM_JOB_SERVICE_ACCOUNT: ${{ vars.GCP_SCOMM_JOB_SERVICE_ACCOUNT || '' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      HISTORY_SUPABASE_URL: ${{ vars.HISTORY_SUPABASE_URL }}
      UK_AQ_CORE_SCHEMA: ${{ vars.UK_AQ_CORE_SCHEMA || 'uk_aq_core' }}
      UK_AQ_RAW_SCHEMA: ${{ vars.UK_AQ_RAW_SCHEMA || 'uk_aq_raw' }}
      HISTORY_SCHEMA: ${{ vars.HISTORY_SCHEMA || 'uk_aq_public' }}
      HISTORY_WRITE_MODE: ${{ vars.SCOMM_HISTORY_WRITE_MODE || 'pubsub_only' }}
      GCP_HISTORY_PUBSUB_TOPIC: ${{ vars.GCP_HISTORY_PUBSUB_TOPIC || 'uk-aq-history-observations' }}
      HISTORY_PUBSUB_PUBLISH_BATCH_SIZE: ${{ vars.HISTORY_PUBSUB_PUBLISH_BATCH_SIZE || '500' }}
      SCOMM_COUNTRY: ${{ vars.SCOMM_COUNTRY || 'GB' }}
      SCOMM_BASE_URL: ${{ vars.SCOMM_BASE_URL || 'https://data.sensor.community' }}
      SCOMM_SERVICE_REF: ${{ vars.SCOMM_SERVICE_REF || 'sensorcommunity' }}
      SCOMM_USER_AGENT: ${{ vars.SCOMM_USER_AGENT || 'uk-air-quality-networks' }}
      SCOMM_INGEST_MET_FIELDS: ${{ vars.SCOMM_INGEST_MET_FIELDS || 'true' }}
      SCOMM_RAW_DROPBOX_ALLOWED_SUPABASE_URL: ${{ vars.SCOMM_RAW_DROPBOX_ALLOWED_SUPABASE_URL || '' }}
      UK_AIR_RAW_DROPBOX_ALLOWED_SUPABASE_URL: ${{ vars.UK_AIR_RAW_DROPBOX_ALLOWED_SUPABASE_URL || '' }}
      SCOMM_DROPBOX_ROOT: ${{ vars.SCOMM_DROPBOX_ROOT || '/CIC-Test' }}
      UK_AQ_DROPBOX_ROOT: ${{ vars.UK_AQ_DROPBOX_ROOT || '/CIC-Test' }}
      SCOMM_RAW_DROPBOX_FOLDER: ${{ vars.SCOMM_RAW_DROPBOX_FOLDER || '/connectors/sensorcommunity/raw_data' }}
      UK_AIR_RAW_DROPBOX_FOLDER: ${{ vars.UK_AIR_RAW_DROPBOX_FOLDER || '/connectors/sensorcommunity/raw_data' }}
      SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
      HISTORY_SERVICE_ROLE_KEY: ${{ secrets.HISTORY_SERVICE_ROLE_KEY }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      SB_SECRET_KEY_SECRET_NAME: ${{ vars.SB_SECRET_KEY_SECRET_NAME || 'SB_SECRET_KEY' }}
      HISTORY_SERVICE_ROLE_KEY_SECRET_NAME: ${{ vars.HISTORY_SERVICE_ROLE_KEY_SECRET_NAME || 'HISTORY_SERVICE_ROLE_KEY' }}
      DROPBOX_APP_KEY_SECRET_NAME: ${{ vars.DROPBOX_APP_KEY_SECRET_NAME || 'DROPBOX_APP_KEY' }}
      DROPBOX_APP_SECRET_SECRET_NAME: ${{ vars.DROPBOX_APP_SECRET_SECRET_NAME || 'DROPBOX_APP_SECRET' }}
      DROPBOX_REFRESH_TOKEN_SECRET_NAME: ${{ vars.DROPBOX_REFRESH_TOKEN_SECRET_NAME || 'DROPBOX_REFRESH_TOKEN' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project config
        run: |
          if [ -z "${PROJECT_ID:-}" ]; then
            echo "Missing required secret: GCP_PROJECT_ID"
            exit 1
          fi
          history_mode="$(printf '%s' "${HISTORY_WRITE_MODE:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "${history_mode}" = "pubsub_only" ]; then
            if [ -z "${GCP_HISTORY_PUBSUB_TOPIC:-}" ]; then
              echo "HISTORY_WRITE_MODE=pubsub_only requires GCP_HISTORY_PUBSUB_TOPIC."
              exit 1
            fi
          fi

      - name: Validate Google auth config
        run: |
          if [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ] && [ -n "${GCP_SERVICE_ACCOUNT:-}" ]; then
            echo "Using Workload Identity Federation auth."
          elif [ -n "${GCP_SA_KEY:-}" ]; then
            echo "Using Service Account key auth."
          else
            echo "Missing Google auth config."
            echo "Set either:"
            echo "1) GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT"
            echo "or"
            echo "2) GCP_SA_KEY"
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key fallback)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud project
        run: |
          gcloud config set project "${PROJECT_ID}"
          gcloud config set run/region "${REGION}"

      - name: Verify Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${REPO}" \
            --location "${REGION}" \
            --project "${PROJECT_ID}" >/dev/null

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push Sensor.Community image
        id: build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/uk-aq-scomm:${GITHUB_SHA::12}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          docker build -t "${IMAGE}" workers/uk_aq_sensorcommunity_cloud_run
          docker push "${IMAGE}"

      - name: Validate Cloud Run job exists
        run: |
          gcloud run jobs describe "${JOB_NAME}" --region "${REGION}" >/dev/null

      - name: Ensure history Pub/Sub topic + publisher IAM binding
        run: |
          set -euo pipefail
          history_mode="$(printf '%s' "${HISTORY_WRITE_MODE:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "${history_mode}" != "pubsub_only" ]; then
            echo "Skipping Pub/Sub publisher setup (HISTORY_WRITE_MODE=${HISTORY_WRITE_MODE})."
            exit 0
          fi

          if gcloud pubsub topics describe "${GCP_HISTORY_PUBSUB_TOPIC}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
            echo "Pub/Sub topic exists: ${GCP_HISTORY_PUBSUB_TOPIC}"
          else
            gcloud pubsub topics create "${GCP_HISTORY_PUBSUB_TOPIC}" --project "${PROJECT_ID}"
            echo "Created Pub/Sub topic: ${GCP_HISTORY_PUBSUB_TOPIC}"
          fi

          runtime_sa="$(gcloud run jobs describe "${JOB_NAME}" --region "${REGION}" --format='value(template.template.serviceAccount)')"
          if [ -z "${runtime_sa}" ]; then
            runtime_sa="$(gcloud run jobs describe "${JOB_NAME}" --region "${REGION}" --format='value(template.template.service_account)')"
          fi
          if [ -z "${runtime_sa}" ] && [ -n "${GCP_SCOMM_JOB_SERVICE_ACCOUNT:-}" ]; then
            runtime_sa="${GCP_SCOMM_JOB_SERVICE_ACCOUNT}"
          fi
          if [ -z "${runtime_sa}" ]; then
            project_number="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
            if [ -n "${project_number}" ]; then
              runtime_sa="${project_number}-compute@developer.gserviceaccount.com"
            fi
          fi
          if [ -z "${runtime_sa}" ]; then
            echo "Unable to resolve Cloud Run job service account for ${JOB_NAME}. Set repo variable GCP_SCOMM_JOB_SERVICE_ACCOUNT."
            exit 1
          fi
          echo "Using runtime service account: ${runtime_sa}"

          gcloud pubsub topics add-iam-policy-binding "${GCP_HISTORY_PUBSUB_TOPIC}" \
            --project "${PROJECT_ID}" \
            --member "serviceAccount:${runtime_sa}" \
            --role "roles/pubsub.publisher" >/dev/null

      - name: Sync GitHub secrets to GCP Secret Manager
        run: |
          set -euo pipefail
          UPSERT_SCRIPT="scripts/gcp/uk_aq_secret_upsert_if_changed.sh"

          upsert_secret() {
            local secret_name="$1"
            local secret_value="$2"
            local required="${3:-0}"

            if [ -z "${secret_name}" ]; then
              if [ "${required}" = "1" ]; then
                echo "Missing required secret name."
                exit 1
              fi
              return 0
            fi

            if [ -z "${secret_value}" ] && [ "${required}" = "0" ]; then
              echo "Skipping optional secret ${secret_name} (no GitHub secret/variable value)."
              return 0
            fi

            printf '%s' "${secret_value}" | "${UPSERT_SCRIPT}" \
              --project "${PROJECT_ID}" \
              --secret "${secret_name}" \
              --required "${required}"
          }

          upsert_secret "${SB_SECRET_KEY_SECRET_NAME}" "${SB_SECRET_KEY}" 1
          upsert_secret "${HISTORY_SERVICE_ROLE_KEY_SECRET_NAME}" "${HISTORY_SERVICE_ROLE_KEY}" 0
          upsert_secret "${DROPBOX_APP_KEY_SECRET_NAME}" "${DROPBOX_APP_KEY}" 0
          upsert_secret "${DROPBOX_APP_SECRET_SECRET_NAME}" "${DROPBOX_APP_SECRET}" 0
          upsert_secret "${DROPBOX_REFRESH_TOKEN_SECRET_NAME}" "${DROPBOX_REFRESH_TOKEN}" 0

      - name: Build Cloud Run env and secret args
        id: cloudrun_args
        run: |
          set -euo pipefail

          require_env() {
            local key="$1"
            local value="${!key:-}"
            if [ -z "${value}" ]; then
              echo "Missing required value for ${key}"
              exit 1
            fi
          }

          add_env() {
            local key="$1"
            local value="${!key:-}"
            if [ -n "${value}" ]; then
              env_updates+=("${key}=${value}")
            fi
          }

          add_secret_binding() {
            local env_key="$1"
            local secret_name="$2"
            local required="${3:-0}"
            if [ -z "${secret_name}" ]; then
              if [ "${required}" = "1" ]; then
                echo "Missing secret name for required binding ${env_key}"
                exit 1
              fi
              return 0
            fi
            if gcloud secrets describe "${secret_name}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
              secret_updates+=("${env_key}=${secret_name}:latest")
              return 0
            fi
            if [ "${required}" = "1" ]; then
              echo "Required Secret Manager secret not found: ${secret_name}"
              exit 1
            fi
            echo "Optional Secret Manager secret not found, skipping: ${secret_name}"
          }

          require_env SUPABASE_URL

          env_updates=()
          add_env SUPABASE_URL
          add_env HISTORY_WRITE_MODE
          add_env GCP_HISTORY_PUBSUB_TOPIC
          add_env HISTORY_PUBSUB_PUBLISH_BATCH_SIZE
          add_env UK_AQ_CORE_SCHEMA
          add_env UK_AQ_RAW_SCHEMA
          add_env SCOMM_COUNTRY
          add_env SCOMM_BASE_URL
          add_env SCOMM_SERVICE_REF
          add_env SCOMM_USER_AGENT
          add_env SCOMM_INGEST_MET_FIELDS
          add_env SCOMM_RAW_DROPBOX_ALLOWED_SUPABASE_URL
          add_env UK_AIR_RAW_DROPBOX_ALLOWED_SUPABASE_URL
          add_env SCOMM_DROPBOX_ROOT
          add_env UK_AQ_DROPBOX_ROOT
          add_env SCOMM_RAW_DROPBOX_FOLDER
          add_env UK_AIR_RAW_DROPBOX_FOLDER
          env_updates+=("GCP_PROJECT_ID=${PROJECT_ID}")
          if [ -n "${HISTORY_SUPABASE_URL:-}" ]; then
            add_env HISTORY_SUPABASE_URL
            add_env HISTORY_SCHEMA
          fi

          secret_updates=()
          add_secret_binding "SB_SECRET_KEY" "${SB_SECRET_KEY_SECRET_NAME}" 1
          add_secret_binding "HISTORY_SERVICE_ROLE_KEY" "${HISTORY_SERVICE_ROLE_KEY_SECRET_NAME}" 0
          add_secret_binding "DROPBOX_APP_KEY" "${DROPBOX_APP_KEY_SECRET_NAME}" 0
          add_secret_binding "DROPBOX_APP_SECRET" "${DROPBOX_APP_SECRET_SECRET_NAME}" 0
          add_secret_binding "DROPBOX_REFRESH_TOKEN" "${DROPBOX_REFRESH_TOKEN_SECRET_NAME}" 0

          env_csv="$(IFS=,; echo "${env_updates[*]}")"
          secret_csv="$(IFS=,; echo "${secret_updates[*]}")"
          echo "env_csv=${env_csv}" >> "${GITHUB_OUTPUT}"
          echo "secret_csv=${secret_csv}" >> "${GITHUB_OUTPUT}"

      - name: Determine whether Cloud Run update is required
        id: cloudrun_diff
        run: |
          set -euo pipefail
          ENV_CSV='${{ steps.cloudrun_args.outputs.env_csv }}'
          SECRET_CSV='${{ steps.cloudrun_args.outputs.secret_csv }}'
          JOB_JSON="${RUNNER_TEMP}/${JOB_NAME}-current.json"
          gcloud run jobs describe "${JOB_NAME}" --region "${REGION}" --format=json > "${JOB_JSON}"

          needs_update="$(python3 scripts/gcp/uk_aq_cloud_run_job_has_changes.py \
            --job-json "${JOB_JSON}" \
            --image "${{ steps.build.outputs.image }}" \
            --env-csv "${ENV_CSV}" \
            --secret-csv "${SECRET_CSV}" \
            --label-csv "job_name=${JOB_NAME}" \
            --verbose)"
          echo "needs_update=${needs_update}" >> "${GITHUB_OUTPUT}"

      - name: Update Cloud Run job image
        if: ${{ steps.cloudrun_diff.outputs.needs_update == 'true' }}
        run: |
          set -euo pipefail
          ENV_CSV='${{ steps.cloudrun_args.outputs.env_csv }}'
          SECRET_CSV='${{ steps.cloudrun_args.outputs.secret_csv }}'

          CMD=(
            gcloud run jobs update "${JOB_NAME}"
            --region "${REGION}"
            --image "${{ steps.build.outputs.image }}"
            --update-labels "job_name=${JOB_NAME}"
          )
          if [ -n "${ENV_CSV}" ]; then
            CMD+=(--set-env-vars "${ENV_CSV}")
          fi
          if [ -n "${SECRET_CSV}" ]; then
            CMD+=(--set-secrets "${SECRET_CSV}")
          fi
          "${CMD[@]}"

      - name: Skip Cloud Run job update
        if: ${{ steps.cloudrun_diff.outputs.needs_update != 'true' }}
        run: |
          echo "Cloud Run job is already up to date; skipping update."

      - name: Verify Cloud Run job labels
        run: |
          set -euo pipefail
          labels_json="$(gcloud run jobs describe "${JOB_NAME}" --region "${REGION}" --format="json(metadata.labels)")"
          job_name_label="$(
            python3 -c 'import json,sys; print(((json.loads(sys.stdin.read()) or {}).get("metadata", {}) or {}).get("labels", {}).get("job_name", ""))' <<<"${labels_json}"
          )"
          if [ "${job_name_label}" != "${JOB_NAME}" ]; then
            echo "job_name label mismatch: expected ${JOB_NAME}, got ${job_name_label:-<missing>}"
            exit 1
          fi
          echo "Verified label job_name=${job_name_label}"

      - name: Show deployed job
        run: |
          gcloud run jobs describe "${JOB_NAME}" \
            --region "${REGION}" \
            --format="yaml(name,template.template.containers[0].image,template.template.timeoutSeconds)"
