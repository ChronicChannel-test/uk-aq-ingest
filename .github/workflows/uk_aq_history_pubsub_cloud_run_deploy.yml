name: Deploy History Pub/Sub Cloud Run Job

on:
  push:
    branches:
      - main
    paths:
      - "workers/uk_aq_history_pubsub_cloud_run/**"
      - "supabase/functions/_shared/fetch_egress_patch.ts"
      - "supabase/functions/_shared/egress_metrics.ts"
      - "supabase/functions/_shared/history_client.ts"
      - ".github/workflows/uk_aq_history_pubsub_cloud_run_deploy.yml"
  workflow_dispatch:

jobs:
  deploy-history-pubsub-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO || 'uk-aq' }}
      JOB_NAME: ${{ vars.GCP_HISTORY_PUBSUB_JOB_NAME || 'uk-aq-history-pubsub-writer' }}
      JOB_SERVICE_ACCOUNT: ${{ vars.GCP_HISTORY_PUBSUB_JOB_SERVICE_ACCOUNT || secrets.GCP_HISTORY_PUBSUB_JOB_SERVICE_ACCOUNT || '' }}
      JOB_TIMEOUT_SECONDS: ${{ vars.GCP_HISTORY_PUBSUB_JOB_TIMEOUT_SECONDS || '1500' }}
      JOB_MAX_RETRIES: ${{ vars.GCP_HISTORY_PUBSUB_JOB_MAX_RETRIES || '0' }}
      SCHEDULER_ENABLED: ${{ vars.GCP_HISTORY_PUBSUB_SCHEDULER_ENABLED || 'true' }}
      SCHEDULER_JOB_NAME: ${{ vars.GCP_HISTORY_PUBSUB_SCHEDULER_JOB_NAME || 'uk-aq-history-pubsub-hourly' }}
      SCHEDULER_CRON: ${{ vars.GCP_HISTORY_PUBSUB_SCHEDULER_CRON || '0 * * * *' }}
      SCHEDULER_TIMEZONE: ${{ vars.GCP_HISTORY_PUBSUB_SCHEDULER_TIMEZONE || 'Etc/UTC' }}
      SCHEDULER_MAX_RETRY_ATTEMPTS: ${{ vars.GCP_HISTORY_PUBSUB_SCHEDULER_MAX_RETRY_ATTEMPTS || '0' }}
      SCHEDULER_SERVICE_ACCOUNT: ${{ vars.GCP_HISTORY_PUBSUB_SCHEDULER_SERVICE_ACCOUNT || '' }}
      PUBSUB_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      PUBSUB_TOPIC: ${{ vars.GCP_HISTORY_PUBSUB_TOPIC || vars.HISTORY_PUBSUB_TOPIC || 'uk-aq-history-observations' }}
      PUBSUB_SUBSCRIPTION: ${{ vars.HISTORY_PUBSUB_SUBSCRIPTION || 'uk-aq-history-observations-sub' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      HISTORY_SUPABASE_URL: ${{ secrets.HISTORY_SUPABASE_URL }}
      UK_AQ_PUBLIC_SCHEMA: ${{ vars.UK_AQ_PUBLIC_SCHEMA || 'uk_aq_public' }}
      HISTORY_SCHEMA: ${{ vars.HISTORY_SCHEMA || 'uk_aq_public' }}
      HISTORY_UPSERT_RPC: ${{ vars.HISTORY_UPSERT_RPC || 'uk_aq_rpc_history_observations_upsert' }}
      HISTORY_UPSERT_CHUNK_SIZE: ${{ vars.HISTORY_UPSERT_CHUNK_SIZE || '5000' }}
      HISTORY_PUBSUB_PULL_MAX_MESSAGES: ${{ vars.HISTORY_PUBSUB_PULL_MAX_MESSAGES || '1000' }}
      HISTORY_PUBSUB_WRITER_MAX_BATCHES: ${{ vars.HISTORY_PUBSUB_WRITER_MAX_BATCHES || '24' }}
      HISTORY_PUBSUB_WRITER_BUDGET_SECONDS: ${{ vars.HISTORY_PUBSUB_WRITER_BUDGET_SECONDS || '1200' }}
      HISTORY_PUBSUB_WRITER_SHUTDOWN_BUFFER_SECONDS: ${{ vars.HISTORY_PUBSUB_WRITER_SHUTDOWN_BUFFER_SECONDS || '20' }}
      HISTORY_PUBSUB_WRITER_RPC_RETRIES: ${{ vars.HISTORY_PUBSUB_WRITER_RPC_RETRIES || '3' }}
      HISTORY_PUBSUB_WRITER_PUBSUB_RETRIES: ${{ vars.HISTORY_PUBSUB_WRITER_PUBSUB_RETRIES || '3' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HISTORY_SERVICE_ROLE_KEY: ${{ secrets.HISTORY_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY_SECRET_NAME: ${{ vars.SUPABASE_SERVICE_ROLE_KEY_SECRET_NAME || 'SUPABASE_SERVICE_ROLE_KEY' }}
      HISTORY_SERVICE_ROLE_KEY_SECRET_NAME: ${{ vars.HISTORY_SERVICE_ROLE_KEY_SECRET_NAME || 'HISTORY_SERVICE_ROLE_KEY' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project config
        run: |
          if [ -z "${PROJECT_ID:-}" ]; then
            echo "Missing required secret: GCP_PROJECT_ID"
            exit 1
          fi
          if [ -z "${JOB_SERVICE_ACCOUNT:-}" ]; then
            echo "Missing required service account setting."
            echo "Set either repo variable or repo secret: GCP_HISTORY_PUBSUB_JOB_SERVICE_ACCOUNT"
            exit 1
          fi
          if [[ "${JOB_SERVICE_ACCOUNT}" == *"-compute@developer.gserviceaccount.com" ]]; then
            echo "Invalid GCP_HISTORY_PUBSUB_JOB_SERVICE_ACCOUNT: default compute service account is not allowed."
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing required secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "${HISTORY_SUPABASE_URL:-}" ]; then
            echo "Missing required secret: HISTORY_SUPABASE_URL"
            exit 1
          fi
          if [ -z "${PUBSUB_PROJECT_ID:-}" ] || [ -z "${PUBSUB_TOPIC:-}" ] || [ -z "${PUBSUB_SUBSCRIPTION:-}" ]; then
            echo "Missing Pub/Sub configuration. Require PUBSUB_PROJECT_ID, PUBSUB_TOPIC, PUBSUB_SUBSCRIPTION."
            exit 1
          fi

      - name: Validate Google auth config
        run: |
          if [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ] && [ -n "${GCP_SERVICE_ACCOUNT:-}" ]; then
            echo "Using Workload Identity Federation auth."
          elif [ -n "${GCP_SA_KEY:-}" ]; then
            echo "Using Service Account key auth."
          else
            echo "Missing Google auth config."
            echo "Set either:"
            echo "1) GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT"
            echo "or"
            echo "2) GCP_SA_KEY"
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key fallback)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud project
        run: |
          gcloud config set project "${PROJECT_ID}"
          gcloud config set run/region "${REGION}"

      - name: Verify Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${REPO}" \
            --location "${REGION}" \
            --project "${PROJECT_ID}" >/dev/null

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push history pubsub image
        id: build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/uk-aq-history-pubsub:${GITHUB_SHA::12}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          docker build -f workers/uk_aq_history_pubsub_cloud_run/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Ensure Pub/Sub topic/subscription + IAM bindings
        run: |
          set -euo pipefail

          if gcloud pubsub topics describe "${PUBSUB_TOPIC}" --project "${PUBSUB_PROJECT_ID}" >/dev/null 2>&1; then
            echo "Pub/Sub topic exists: ${PUBSUB_TOPIC}"
          else
            gcloud pubsub topics create "${PUBSUB_TOPIC}" --project "${PUBSUB_PROJECT_ID}"
            echo "Created Pub/Sub topic: ${PUBSUB_TOPIC}"
          fi

          if gcloud pubsub subscriptions describe "${PUBSUB_SUBSCRIPTION}" --project "${PUBSUB_PROJECT_ID}" >/dev/null 2>&1; then
            echo "Pub/Sub subscription exists: ${PUBSUB_SUBSCRIPTION}"
          else
            gcloud pubsub subscriptions create "${PUBSUB_SUBSCRIPTION}" \
              --project "${PUBSUB_PROJECT_ID}" \
              --topic "${PUBSUB_TOPIC}" \
              --ack-deadline "600"
            echo "Created Pub/Sub subscription: ${PUBSUB_SUBSCRIPTION}"
          fi

          gcloud pubsub subscriptions add-iam-policy-binding "${PUBSUB_SUBSCRIPTION}" \
            --project "${PUBSUB_PROJECT_ID}" \
            --member "serviceAccount:${JOB_SERVICE_ACCOUNT}" \
            --role "roles/pubsub.subscriber" >/dev/null

      - name: Ensure Cloud Run job exists
        run: |
          set -euo pipefail
          if gcloud run jobs describe "${JOB_NAME}" --region "${REGION}" >/dev/null 2>&1; then
            echo "Cloud Run job exists: ${JOB_NAME}"
            exit 0
          fi

          gcloud run jobs create "${JOB_NAME}" \
            --region "${REGION}" \
            --image "${{ steps.build.outputs.image }}" \
            --task-timeout "${JOB_TIMEOUT_SECONDS}s" \
            --max-retries "${JOB_MAX_RETRIES}" \
            --service-account "${JOB_SERVICE_ACCOUNT}"

      - name: Sync GitHub secrets to GCP Secret Manager
        run: |
          set -euo pipefail

          upsert_secret() {
            local secret_name="$1"
            local secret_value="$2"
            local required="${3:-0}"

            if [ -z "${secret_name}" ]; then
              if [ "${required}" = "1" ]; then
                echo "Missing required secret name."
                exit 1
              fi
              return 0
            fi

            if [ -z "${secret_value}" ]; then
              if [ "${required}" = "1" ]; then
                echo "Missing required secret value for ${secret_name} in GitHub Secrets."
                exit 1
              fi
              return 0
            fi

            if gcloud secrets describe "${secret_name}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
              printf '%s' "${secret_value}" | gcloud secrets versions add "${secret_name}" \
                --project "${PROJECT_ID}" \
                --data-file=-
            else
              printf '%s' "${secret_value}" | gcloud secrets create "${secret_name}" \
                --project "${PROJECT_ID}" \
                --replication-policy="automatic" \
                --data-file=-
            fi
          }

          upsert_secret "${SUPABASE_SERVICE_ROLE_KEY_SECRET_NAME}" "${SUPABASE_SERVICE_ROLE_KEY}" 1
          upsert_secret "${HISTORY_SERVICE_ROLE_KEY_SECRET_NAME}" "${HISTORY_SERVICE_ROLE_KEY}" 1

      - name: Build Cloud Run env and secret args
        id: cloudrun_args
        run: |
          set -euo pipefail

          require_env() {
            local key="$1"
            local value="${!key:-}"
            if [ -z "${value}" ]; then
              echo "Missing required value for ${key}"
              exit 1
            fi
          }

          add_env() {
            local key="$1"
            local value="${!key:-}"
            if [ -n "${value}" ]; then
              env_updates+=("${key}=${value}")
            fi
          }

          add_secret_binding() {
            local env_key="$1"
            local secret_name="$2"
            local required="${3:-0}"
            if [ -z "${secret_name}" ]; then
              if [ "${required}" = "1" ]; then
                echo "Missing secret name for required binding ${env_key}"
                exit 1
              fi
              return 0
            fi
            if gcloud secrets describe "${secret_name}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
              secret_updates+=("${env_key}=${secret_name}:latest")
              return 0
            fi
            if [ "${required}" = "1" ]; then
              echo "Required Secret Manager secret not found: ${secret_name}"
              exit 1
            fi
          }

          require_env SUPABASE_URL
          require_env HISTORY_SUPABASE_URL
          require_env PUBSUB_PROJECT_ID
          require_env PUBSUB_SUBSCRIPTION

          env_updates=()
          add_env SUPABASE_URL
          add_env HISTORY_SUPABASE_URL
          add_env UK_AQ_PUBLIC_SCHEMA
          add_env HISTORY_SCHEMA
          add_env HISTORY_UPSERT_RPC
          add_env HISTORY_UPSERT_CHUNK_SIZE
          add_env HISTORY_PUBSUB_PULL_MAX_MESSAGES
          add_env HISTORY_PUBSUB_WRITER_MAX_BATCHES
          add_env HISTORY_PUBSUB_WRITER_BUDGET_SECONDS
          add_env HISTORY_PUBSUB_WRITER_SHUTDOWN_BUFFER_SECONDS
          add_env HISTORY_PUBSUB_WRITER_RPC_RETRIES
          add_env HISTORY_PUBSUB_WRITER_PUBSUB_RETRIES
          env_updates+=("GCP_PROJECT_ID=${PROJECT_ID}")
          env_updates+=("HISTORY_PUBSUB_SUBSCRIPTION=${PUBSUB_SUBSCRIPTION}")

          secret_updates=()
          add_secret_binding "SUPABASE_SERVICE_ROLE_KEY" "${SUPABASE_SERVICE_ROLE_KEY_SECRET_NAME}" 1
          add_secret_binding "HISTORY_SERVICE_ROLE_KEY" "${HISTORY_SERVICE_ROLE_KEY_SECRET_NAME}" 1

          env_file="${RUNNER_TEMP}/uk-aq-history-pubsub-env.yaml"
          : > "${env_file}"
          for kv in "${env_updates[@]}"; do
            key="${kv%%=*}"
            value="${kv#*=}"
            python3 -c 'import json,sys; f=open(sys.argv[1], "a", encoding="utf-8"); print(f"{sys.argv[2]}: {json.dumps(sys.argv[3])}", file=f); f.close()' \
              "${env_file}" "${key}" "${value}"
          done

          secret_csv="$(IFS=,; echo "${secret_updates[*]}")"
          echo "env_file=${env_file}" >> "${GITHUB_OUTPUT}"
          echo "secret_csv=${secret_csv}" >> "${GITHUB_OUTPUT}"

      - name: Update Cloud Run job image
        run: |
          set -euo pipefail
          ENV_FILE='${{ steps.cloudrun_args.outputs.env_file }}'
          SECRET_CSV='${{ steps.cloudrun_args.outputs.secret_csv }}'

          CMD=(
            gcloud run jobs update "${JOB_NAME}"
            --region "${REGION}"
            --image "${{ steps.build.outputs.image }}"
            --task-timeout "${JOB_TIMEOUT_SECONDS}s"
            --max-retries "${JOB_MAX_RETRIES}"
            --service-account "${JOB_SERVICE_ACCOUNT}"
          )
          if [ -n "${ENV_FILE}" ]; then
            CMD+=(--env-vars-file "${ENV_FILE}")
          fi
          if [ -n "${SECRET_CSV}" ]; then
            CMD+=(--update-secrets "${SECRET_CSV}")
          fi
          "${CMD[@]}"

      - name: Ensure Cloud Scheduler trigger exists
        run: |
          set -euo pipefail

          enabled="$(printf '%s' "${SCHEDULER_ENABLED}" | tr '[:upper:]' '[:lower:]')"
          if [ "${enabled}" != "true" ] && [ "${enabled}" != "1" ] && [ "${enabled}" != "yes" ]; then
            echo "Skipping scheduler trigger management (SCHEDULER_ENABLED=${SCHEDULER_ENABLED})."
            exit 0
          fi

          scheduler_sa="${SCHEDULER_SERVICE_ACCOUNT:-${JOB_SERVICE_ACCOUNT}}"
          run_uri="https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/jobs/${JOB_NAME}:run"

          gcloud run jobs add-iam-policy-binding "${JOB_NAME}" \
            --region "${REGION}" \
            --member "serviceAccount:${scheduler_sa}" \
            --role "roles/run.invoker" >/dev/null

          if gcloud scheduler jobs describe "${SCHEDULER_JOB_NAME}" --location "${REGION}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "${SCHEDULER_JOB_NAME}" \
              --location "${REGION}" \
              --schedule "${SCHEDULER_CRON}" \
              --time-zone "${SCHEDULER_TIMEZONE}" \
              --uri "${run_uri}" \
              --http-method POST \
              --oauth-service-account-email "${scheduler_sa}" \
              --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
              --max-retry-attempts "${SCHEDULER_MAX_RETRY_ATTEMPTS}"
          else
            gcloud scheduler jobs create http "${SCHEDULER_JOB_NAME}" \
              --location "${REGION}" \
              --schedule "${SCHEDULER_CRON}" \
              --time-zone "${SCHEDULER_TIMEZONE}" \
              --uri "${run_uri}" \
              --http-method POST \
              --oauth-service-account-email "${scheduler_sa}" \
              --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
              --max-retry-attempts "${SCHEDULER_MAX_RETRY_ATTEMPTS}"
          fi

      - name: Show deployed job
        run: |
          gcloud run jobs describe "${JOB_NAME}" \
            --region "${REGION}" \
            --format="yaml(name,template.template.serviceAccount,template.template.containers[0].image,template.template.timeoutSeconds)"
