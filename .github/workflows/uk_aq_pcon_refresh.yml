name: UK-AQ PCON Refresh

permissions:
  contents: read

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch:

concurrency:
  group: uk-aq-pcon-refresh
  cancel-in-progress: false

jobs:
  refresh-pcon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests python-dotenv supabase

      - name: Resolve PCON GeoJSON from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          PCON_GEOJSON_DROPBOX_BASE: ${{ secrets.PCON_GEOJSON_DROPBOX_BASE }}
          PCON_GEOJSON_DROPBOX_PATH: ${{ secrets.PCON_GEOJSON_DROPBOX_PATH }}
          PCON_VERSION: ${{ secrets.PCON_VERSION }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path
          import requests

          app_key = os.environ.get("DROPBOX_APP_KEY")
          app_secret = os.environ.get("DROPBOX_APP_SECRET")
          refresh_token = os.environ.get("DROPBOX_REFRESH_TOKEN")
          base_path = os.environ.get("PCON_GEOJSON_DROPBOX_BASE") or os.environ.get("PCON_GEOJSON_DROPBOX_PATH")
          if not all([app_key, app_secret, refresh_token, base_path]):
              print("Missing Dropbox credentials or PCON GeoJSON path.", file=sys.stderr)
              sys.exit(1)

          def dropbox_request(endpoint, payload=None):
              resp = requests.post(
                  f"https://api.dropboxapi.com/2/{endpoint}",
                  headers={"Authorization": f"Bearer {access_token}"},
                  json=payload,
                  timeout=30,
              )
              try:
                  resp.raise_for_status()
              except requests.HTTPError:
                  detail = resp.text
                  print(
                      f"Dropbox API error for {endpoint} (status {resp.status_code}): {detail}",
                      file=sys.stderr,
                  )
                  raise
              if resp.content:
                  return resp.json()
              return {}

          token_resp = requests.post(
              "https://api.dropbox.com/oauth2/token",
              data={
                  "grant_type": "refresh_token",
                  "refresh_token": refresh_token,
                  "client_id": app_key,
                  "client_secret": app_secret,
              },
              timeout=30,
          )
          token_resp.raise_for_status()
          access_token = token_resp.json()["access_token"]

          account_info = dropbox_request("users/get_current_account")
          root_info = account_info.get("root_info", {})
          root_tag = root_info.get(".tag")
          app_folder_name = root_info.get("app_folder_name")
          account_email = account_info.get("email")
          account_id = account_info.get("account_id")
          print(f"Dropbox account: {account_email} ({account_id})")
          print(f"Dropbox root_info: {root_info}")
          print(f"Dropbox root_tag: {root_tag}, app_folder_name: {app_folder_name}")

          def list_folder_all(path, recursive=False):
              payload = {"path": path}
              if recursive:
                  payload["recursive"] = True
              resp = dropbox_request("files/list_folder", payload)
              entries = resp.get("entries", [])
              while resp.get("has_more"):
                  resp = dropbox_request(
                      "files/list_folder/continue", {"cursor": resp.get("cursor")}
                  )
                  entries.extend(resp.get("entries", []))
              return entries

          def normalize_path(path):
              cleaned = path.strip()
              if not cleaned.startswith("/"):
                  cleaned = f"/{cleaned}"
              # App folder tokens expect paths relative to the app root.
              if root_tag == "app_folder" and cleaned.startswith("/Apps/"):
                  parts = cleaned.split("/", 3)
                  if len(parts) >= 4 and (not app_folder_name or parts[2] == app_folder_name):
                      cleaned = f"/{parts[3]}"
              return cleaned

          MONTH_INDEX = {
              "jan": 1,
              "january": 1,
              "feb": 2,
              "february": 2,
              "mar": 3,
              "march": 3,
              "apr": 4,
              "april": 4,
              "may": 5,
              "jun": 6,
              "june": 6,
              "jul": 7,
              "july": 7,
              "aug": 8,
              "august": 8,
              "sep": 9,
              "sept": 9,
              "september": 9,
              "oct": 10,
              "october": 10,
              "nov": 11,
              "november": 11,
              "dec": 12,
              "december": 12,
          }

          def parse_version_tag(name):
              match = re.search(r"(20\\d{2})", name)
              if not match:
                  return None
              year = int(match.group(1))
              lower = name.lower()
              month = 0
              for label, idx in MONTH_INDEX.items():
                  if label in lower:
                      month = idx
                      break
              return year, month

          def entry_version(entry):
              path = entry.get("path_display") or entry.get("path_lower") or entry.get("name") or ""
              best = None
              for part in Path(path).parts:
                  parsed = parse_version_tag(part)
                  if parsed and (not best or parsed > best):
                      best = parsed
              return best

          def choose_geojson(entries, target_year):
              candidates = [(entry_version(entry), entry) for entry in entries]
              if target_year:
                  filtered = [
                      (version, entry)
                      for version, entry in candidates
                      if version and version[0] == target_year
                  ]
                  if filtered:
                      candidates = filtered
                  else:
                      print(
                          f"No GeoJSON matched PCON_VERSION={target_year}; using latest available."
                      )

              if not candidates:
                  return None

              def sort_key(item):
                  version, entry = item
                  path = entry.get("path_display") or entry.get("path_lower") or entry.get("name") or ""
                  if version:
                      return (version[0], version[1], path)
                  return (0, 0, path)

              chosen = sorted(candidates, key=sort_key)[-1][1]
              if len(candidates) > 1:
                  chosen_path = (
                      chosen.get("path_display")
                      or chosen.get("path_lower")
                      or chosen.get("name")
                  )
                  print(f"Multiple GeoJSON files found; selecting {chosen_path}.")
              return chosen

          def parse_year(value):
              return int(value) if value and value.isdigit() else None

          print(f"Raw PCON base path: {base_path}")
          base_path = normalize_path(base_path)
          print(f"Normalized PCON base path: {base_path}")
          raw_pcon_version = (os.environ.get("PCON_VERSION") or "").strip()
          pcon_version = None
          if raw_pcon_version:
              version_match = re.search(r"(20\\d{2})", raw_pcon_version)
              pcon_version = version_match.group(1) if version_match else raw_pcon_version
          if base_path.lower().endswith(".geojson"):
              file_path = base_path
              if not pcon_version:
                  for part in Path(file_path).parts:
                      match = re.search(r"(20\\d{2})", part)
                      if match:
                          pcon_version = match.group(1)
                          break
              if not pcon_version:
                  raise SystemExit("PCON_VERSION is required when using a direct GeoJSON path.")
          else:
              listing = list_folder_all(base_path, recursive=False)
              folders = []
              files = []
              print(f"Listing entries under {base_path}:")
              for entry in listing:
                  entry_name = entry.get("name")
                  entry_tag = entry.get(".tag")
                  print(f"- {entry_name} ({entry_tag})")
                  if entry_tag == "folder":
                      parsed = parse_version_tag(entry_name or "")
                      if parsed:
                          folders.append((parsed[0], parsed[1], entry_name))
                  elif entry_tag == "file" and (entry_name or "").lower().endswith(".geojson"):
                      files.append(entry)

              if files:
                  target_year = parse_year(pcon_version)
                  choice = choose_geojson(files, target_year)
                  if not choice:
                      raise SystemExit(f"No GeoJSON files found in {base_path}.")
                  file_path = choice.get("path_display") or choice.get("path_lower")
                  if not pcon_version:
                      version = entry_version(choice)
                      if version:
                          pcon_version = str(version[0])
                      else:
                          match = re.search(r"(20\\d{2})", file_path or "")
                          if match:
                              pcon_version = match.group(1)
              else:
                  target_year = parse_year(pcon_version)
                  if folders:
                      if target_year:
                          matching = [folder for folder in folders if folder[0] == target_year]
                          if matching:
                              year_folder = sorted(matching)[-1][2]
                          else:
                              print(
                                  f"No folder match for PCON_VERSION={pcon_version}; "
                                  "falling back to latest available."
                              )
                              year_folder = sorted(folders)[-1][2]
                      else:
                          year_folder = sorted(folders)[-1][2]
                      year_path = normalize_path(f"{base_path}/{year_folder}")
                      if not pcon_version:
                          pcon_version = str(sorted(folders)[-1][0])
                  else:
                      year_path = base_path
                      if not pcon_version:
                          match = re.search(r"(20\\d{2})", year_path)
                          if match:
                              pcon_version = match.group(1)

                  year_listing = list_folder_all(year_path, recursive=True)
                  geojson_files = [
                      entry
                      for entry in year_listing
                      if entry.get(".tag") == "file"
                      and entry.get("name", "").lower().endswith(".geojson")
                  ]
                  if not geojson_files:
                      raise SystemExit(f"No GeoJSON files found under {year_path}.")
                  choice = choose_geojson(geojson_files, target_year)
                  if not choice:
                      raise SystemExit(f"No GeoJSON files found under {year_path}.")
                  file_path = choice.get("path_display") or choice.get("path_lower")
                  if not pcon_version:
                      version = entry_version(choice)
                      if version:
                          pcon_version = str(version[0])
                      else:
                          match = re.search(r"(20\\d{2})", file_path or "")
                          if match:
                              pcon_version = match.group(1)

          if not pcon_version:
              raise SystemExit(
                  "PCON_VERSION could not be inferred; set PCON_VERSION explicitly."
              )

          download_resp = requests.post(
              "https://content.dropboxapi.com/2/files/download",
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Dropbox-API-Arg": json.dumps({"path": file_path}),
              },
              timeout=60,
          )
          download_resp.raise_for_status()

          os.makedirs("tmp", exist_ok=True)
          geojson_path = Path("tmp/pcon.geojson")
          geojson_path.write_bytes(download_resp.content)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PCON_VERSION={pcon_version}\n")
              handle.write(f"PCON_GEOJSON_PATH={geojson_path}\n")
          print(f"Downloaded {file_path} to {geojson_path} (version {pcon_version})")
          PY

      - name: Check existing PCON boundaries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PCON_VERSION: ${{ env.PCON_VERSION }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.parse
          import requests

          supabase_url = os.environ.get("SUPABASE_URL")
          supabase_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY")
          pcon_version = os.environ.get("PCON_VERSION")
          if not supabase_url or not supabase_key or not pcon_version:
              raise SystemExit("SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and PCON_VERSION are required.")

          params = {
              "select": "pcon_code",
              "pcon_version": f"eq.{pcon_version}",
              "limit": "1",
          }
          url = f"{supabase_url}/rest/v1/pcon_boundaries?{urllib.parse.urlencode(params)}"
          resp = requests.get(
              url,
              headers={
                  "apikey": supabase_key,
                  "Authorization": f"Bearer {supabase_key}",
              },
              timeout=30,
          )
          resp.raise_for_status()
          rows = resp.json()
          skip = "1" if rows else "0"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PCON_SKIP_BOUNDARIES={skip}\\n")

          print(f"Existing boundaries for {pcon_version}: {'yes' if rows else 'no'}")
          PY

      - name: Upload PCON boundaries
        if: env.PCON_SKIP_BOUNDARIES != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PCON_VERSION: ${{ env.PCON_VERSION }}
          PCON_CODE_FIELD: ${{ secrets.PCON_CODE_FIELD }}
          PCON_NAME_FIELD: ${{ secrets.PCON_NAME_FIELD }}
          PCON_SLEEP_SECONDS: ${{ secrets.PCON_SLEEP_SECONDS }}
          PCON_BOUNDARY_BATCH_SIZE: ${{ secrets.PCON_BOUNDARY_BATCH_SIZE }}
          PCON_MAX_RETRIES: ${{ secrets.PCON_MAX_RETRIES }}
          PCON_RETRY_BACKOFF_SECONDS: ${{ secrets.PCON_RETRY_BACKOFF_SECONDS }}
        run: |
          python3 scripts/uk_aq_load_pcon_boundaries.py \
            --geojson "${PCON_GEOJSON_PATH}" \
            --pcon-version "${PCON_VERSION}" \
            --code-field "${PCON_CODE_FIELD:-PCON24CD}" \
            --name-field "${PCON_NAME_FIELD:-PCON24NM}" \
            --skip-if-exists \
            --batch-size "${PCON_BOUNDARY_BATCH_SIZE:-5}" \
            --sleep-seconds "${PCON_SLEEP_SECONDS:-1.0}" \
            --max-retries "${PCON_MAX_RETRIES:-5}" \
            --retry-backoff-seconds "${PCON_RETRY_BACKOFF_SECONDS:-2}"

      - name: Process PCON queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PCON_VERSION: ${{ env.PCON_VERSION }}
          PCON_QUEUE_BATCH_SIZE: ${{ vars.PCON_QUEUE_BATCH_SIZE || secrets.PCON_QUEUE_BATCH_SIZE }}
        run: |
          python3 - <<'PY'
          import os
          import requests
          import urllib.parse
          import json

          supabase_url = os.environ.get("SUPABASE_URL")
          supabase_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY")
          pcon_version = os.environ.get("PCON_VERSION")
          if not supabase_url or not supabase_key or not pcon_version:
              raise SystemExit("SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and PCON_VERSION are required.")

          parsed_url = urllib.parse.urlparse(supabase_url)
          print(f"Using SUPABASE_URL host: {parsed_url.hostname}")
          print(f"Using SUPABASE_URL scheme: {parsed_url.scheme}")
          print(f"Using PCON_VERSION: {pcon_version}")
          print(f"Using service role key length: {len(supabase_key)}")

          batch_limit = int(os.environ.get("PCON_QUEUE_BATCH_SIZE") or "1")
          print(f"Using batch_limit: {batch_limit}")
          payload = {"target_version": pcon_version, "batch_limit": batch_limit}
          rpc_url = f"{supabase_url}/rest/v1/rpc/uk_aq_process_station_pcon_queue"
          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
              "Content-Type": "application/json",
          }

          print(f"RPC URL: {rpc_url}")
          print(f"RPC headers: {sorted(headers.keys())}")
          print(f"RPC payload: {json.dumps(payload)}")

          options_resp = requests.options(rpc_url, headers=headers, timeout=30)
          print(f"RPC OPTIONS status: {options_resp.status_code}")
          print(f"RPC OPTIONS headers: {dict(options_resp.headers)}")
          if options_resp.text:
              print(f"RPC OPTIONS body: {options_resp.text}")

          resp = requests.post(
              rpc_url,
              headers=headers,
              json=payload,
              timeout=60,
          )
          print(f"RPC POST status: {resp.status_code}")
          print(f"RPC POST headers: {dict(resp.headers)}")
          if resp.text:
              print(f"RPC POST body: {resp.text}")
          resp.raise_for_status()
          print(f"Processed PCON queue (updated={resp.json()})")
          PY
