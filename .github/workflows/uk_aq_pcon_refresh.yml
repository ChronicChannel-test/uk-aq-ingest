name: UK-AQ PCON Refresh

permissions:
  contents: read

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: uk-aq-pcon-refresh
  cancel-in-progress: false

jobs:
  refresh-pcon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests python-dotenv supabase

      - name: Resolve PCON GeoJSON from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          PCON_GEOJSON_DROPBOX_BASE: ${{ secrets.PCON_GEOJSON_DROPBOX_BASE }}
          PCON_GEOJSON_DROPBOX_PATH: ${{ secrets.PCON_GEOJSON_DROPBOX_PATH }}
          PCON_VERSION: ${{ secrets.PCON_VERSION }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path
          import requests

          app_key = os.environ.get("DROPBOX_APP_KEY")
          app_secret = os.environ.get("DROPBOX_APP_SECRET")
          refresh_token = os.environ.get("DROPBOX_REFRESH_TOKEN")
          base_path = os.environ.get("PCON_GEOJSON_DROPBOX_BASE") or os.environ.get("PCON_GEOJSON_DROPBOX_PATH")
          if not all([app_key, app_secret, refresh_token, base_path]):
              print("Missing Dropbox credentials or PCON GeoJSON path.", file=sys.stderr)
              sys.exit(1)

          def dropbox_request(endpoint, payload=None):
              resp = requests.post(
                  f"https://api.dropboxapi.com/2/{endpoint}",
                  headers={"Authorization": f"Bearer {access_token}"},
                  json=payload,
                  timeout=30,
              )
              try:
                  resp.raise_for_status()
              except requests.HTTPError:
                  detail = resp.text
                  print(
                      f"Dropbox API error for {endpoint} (status {resp.status_code}): {detail}",
                      file=sys.stderr,
                  )
                  raise
              if resp.content:
                  return resp.json()
              return {}

          token_resp = requests.post(
              "https://api.dropbox.com/oauth2/token",
              data={
                  "grant_type": "refresh_token",
                  "refresh_token": refresh_token,
                  "client_id": app_key,
                  "client_secret": app_secret,
              },
              timeout=30,
          )
          token_resp.raise_for_status()
          access_token = token_resp.json()["access_token"]

          account_info = dropbox_request("users/get_current_account")
          root_info = account_info.get("root_info", {})
          root_tag = root_info.get(".tag")
          app_folder_name = root_info.get("app_folder_name")
          account_email = account_info.get("email")
          account_id = account_info.get("account_id")
          print(f"Dropbox account: {account_email} ({account_id})")
          print(f"Dropbox root_info: {root_info}")
          print(f"Dropbox root_tag: {root_tag}, app_folder_name: {app_folder_name}")

          def normalize_path(path):
              cleaned = path.strip()
              if not cleaned.startswith("/"):
                  cleaned = f"/{cleaned}"
              # App folder tokens expect paths relative to the app root.
              if root_tag == "app_folder" and cleaned.startswith("/Apps/"):
                  parts = cleaned.split("/", 3)
                  if len(parts) >= 4 and (not app_folder_name or parts[2] == app_folder_name):
                      cleaned = f"/{parts[3]}"
              return cleaned

          print(f"Raw PCON base path: {base_path}")
          base_path = normalize_path(base_path)
          print(f"Normalized PCON base path: {base_path}")
          pcon_version = (os.environ.get("PCON_VERSION") or "").strip()
          if base_path.lower().endswith(".geojson"):
              file_path = base_path
              if not pcon_version:
                  for part in Path(file_path).parts:
                      if re.fullmatch(r"\\d{4}", part):
                          pcon_version = part
                          break
              if not pcon_version:
                  raise SystemExit("PCON_VERSION is required when using a direct GeoJSON path.")
          else:
              listing = dropbox_request("files/list_folder", {"path": base_path})
              folders = []
              print(f"Listing entries under {base_path}:")
              for entry in listing.get("entries", []):
                  entry_name = entry.get("name")
                  entry_tag = entry.get(".tag")
                  print(f"- {entry_name} ({entry_tag})")
                  if entry.get(".tag") == "folder" and re.fullmatch(r"\\d{4}", entry.get("name", "")):
                      folders.append(entry["name"])
              if not folders:
                  raise SystemExit(f"No year folders found in {base_path}")
              pcon_version = sorted(folders)[-1]
              year_path = normalize_path(f"{base_path}/{pcon_version}")
              year_listing = dropbox_request("files/list_folder", {"path": year_path})
              files = [
                  entry for entry in year_listing.get("entries", [])
                  if entry.get(".tag") == "file" and entry.get("name", "").lower().endswith(".geojson")
              ]
              if len(files) != 1:
                  raise SystemExit(f"Expected 1 GeoJSON file in {year_path}, found {len(files)}.")
              file_path = files[0]["path_display"] or files[0]["path_lower"]

          download_resp = requests.post(
              "https://content.dropboxapi.com/2/files/download",
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Dropbox-API-Arg": json.dumps({"path": file_path}),
              },
              timeout=60,
          )
          download_resp.raise_for_status()

          os.makedirs("tmp", exist_ok=True)
          geojson_path = Path("tmp/pcon.geojson")
          geojson_path.write_bytes(download_resp.content)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PCON_VERSION={pcon_version}\\n")
              handle.write(f"PCON_GEOJSON_PATH={geojson_path}\\n")
          print(f"Downloaded {file_path} to {geojson_path} (version {pcon_version})")
          PY

      - name: Check existing PCON boundaries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PCON_VERSION: ${{ env.PCON_VERSION }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.parse
          import requests

          supabase_url = os.environ.get("SUPABASE_URL")
          supabase_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY")
          pcon_version = os.environ.get("PCON_VERSION")
          if not supabase_url or not supabase_key or not pcon_version:
              raise SystemExit("SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and PCON_VERSION are required.")

          params = {
              "select": "pcon_code",
              "pcon_version": f"eq.{pcon_version}",
              "limit": "1",
          }
          url = f\"{supabase_url}/rest/v1/pcon_boundaries?{urllib.parse.urlencode(params)}\"
          resp = requests.get(
              url,
              headers={
                  "apikey": supabase_key,
                  "Authorization": f"Bearer {supabase_key}",
              },
              timeout=30,
          )
          resp.raise_for_status()
          rows = resp.json()
          skip = "1" if rows else "0"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PCON_SKIP_BOUNDARIES={skip}\\n")

          print(f"Existing boundaries for {pcon_version}: {'yes' if rows else 'no'}")
          PY

      - name: Upload PCON boundaries
        if: env.PCON_SKIP_BOUNDARIES != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PCON_VERSION: ${{ env.PCON_VERSION }}
          PCON_CODE_FIELD: ${{ secrets.PCON_CODE_FIELD }}
          PCON_NAME_FIELD: ${{ secrets.PCON_NAME_FIELD }}
          PCON_SLEEP_SECONDS: ${{ secrets.PCON_SLEEP_SECONDS }}
          PCON_BOUNDARY_BATCH_SIZE: ${{ secrets.PCON_BOUNDARY_BATCH_SIZE }}
        run: |
          python3 scripts/uk_aq_load_pcon_boundaries.py \
            --geojson "${PCON_GEOJSON_PATH}" \
            --pcon-version "${PCON_VERSION}" \
            --code-field "${PCON_CODE_FIELD:-PCON24CD}" \
            --name-field "${PCON_NAME_FIELD:-PCON24NM}" \
            --batch-size "${PCON_BOUNDARY_BATCH_SIZE:-10}" \
            --sleep-seconds "${PCON_SLEEP_SECONDS:-0.5}"

      - name: Process PCON queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PCON_VERSION: ${{ env.PCON_VERSION }}
          PCON_QUEUE_BATCH_SIZE: ${{ secrets.PCON_QUEUE_BATCH_SIZE }}
        run: |
          python3 - <<'PY'
          import os
          import requests

          supabase_url = os.environ.get("SUPABASE_URL")
          supabase_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY")
          pcon_version = os.environ.get("PCON_VERSION")
          if not supabase_url or not supabase_key or not pcon_version:
              raise SystemExit("SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and PCON_VERSION are required.")

          batch_limit = int(os.environ.get("PCON_QUEUE_BATCH_SIZE") or "5")
          payload = {"target_version": pcon_version, "batch_limit": batch_limit}
          resp = requests.post(
              f"{supabase_url}/rest/v1/rpc/uk_aq_process_station_pcon_queue",
              headers={
                  "apikey": supabase_key,
                  "Authorization": f"Bearer {supabase_key}",
              },
              json=payload,
              timeout=60,
          )
          resp.raise_for_status()
          print(f"Processed PCON queue (updated={resp.json()})")
          PY
