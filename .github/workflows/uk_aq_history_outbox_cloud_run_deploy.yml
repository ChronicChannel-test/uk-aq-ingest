name: Deploy History Outbox Cloud Run Job

on:
  push:
    branches:
      - main
    paths:
      - "workers/uk_aq_history_outbox_cloud_run/**"
      - "supabase/functions/_shared/fetch_egress_patch.ts"
      - "supabase/functions/_shared/egress_metrics.ts"
      - "supabase/functions/_shared/history_client.ts"
      - "scripts/gcp/**"
      - ".github/workflows/uk_aq_history_outbox_cloud_run_deploy.yml"
  workflow_dispatch:

jobs:
  deploy-history-outbox-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO || 'uk-aq' }}
      JOB_NAME: ${{ vars.GCP_HISTORY_OUTBOX_JOB_NAME || 'uk-aq-history-outbox-flush' }}
      JOB_SERVICE_ACCOUNT: ${{ vars.GCP_HISTORY_OUTBOX_JOB_SERVICE_ACCOUNT || '' }}
      JOB_TIMEOUT_SECONDS: ${{ vars.GCP_HISTORY_OUTBOX_JOB_TIMEOUT_SECONDS || '600' }}
      JOB_MAX_RETRIES: ${{ vars.GCP_HISTORY_OUTBOX_JOB_MAX_RETRIES || '0' }}
      SCHEDULER_ENABLED: ${{ vars.GCP_HISTORY_OUTBOX_SCHEDULER_ENABLED || 'true' }}
      SCHEDULER_JOB_NAME: ${{ vars.GCP_HISTORY_OUTBOX_SCHEDULER_JOB_NAME || 'uk-aq-history-outbox-trigger' }}
      SCHEDULER_CRON: ${{ vars.GCP_HISTORY_OUTBOX_SCHEDULER_CRON || '*/10 * * * *' }}
      SCHEDULER_TIMEZONE: ${{ vars.GCP_HISTORY_OUTBOX_SCHEDULER_TIMEZONE || 'Etc/UTC' }}
      SCHEDULER_MAX_RETRY_ATTEMPTS: ${{ vars.GCP_HISTORY_OUTBOX_SCHEDULER_MAX_RETRY_ATTEMPTS || '0' }}
      SCHEDULER_SERVICE_ACCOUNT: ${{ vars.GCP_HISTORY_OUTBOX_SCHEDULER_SERVICE_ACCOUNT || '' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      HISTORY_SUPABASE_URL: ${{ vars.HISTORY_SUPABASE_URL }}
      UK_AQ_PUBLIC_SCHEMA: ${{ vars.UK_AQ_PUBLIC_SCHEMA || 'uk_aq_public' }}
      HISTORY_SCHEMA: ${{ vars.HISTORY_SCHEMA || 'uk_aq_public' }}
      HISTORY_UPSERT_RPC: ${{ vars.HISTORY_UPSERT_RPC || 'uk_aq_rpc_history_observations_upsert' }}
      HISTORY_OUTBOX_FLUSH_LIMIT: ${{ vars.HISTORY_OUTBOX_FLUSH_LIMIT || '3' }}
      HISTORY_UPSERT_CHUNK_SIZE: ${{ vars.HISTORY_UPSERT_CHUNK_SIZE || '1000' }}
      HISTORY_UPSERT_RPC_RETRIES: ${{ vars.HISTORY_UPSERT_RPC_RETRIES || '3' }}
      HISTORY_UPSERT_RETRY_BASE_MS: ${{ vars.HISTORY_UPSERT_RETRY_BASE_MS || '1000' }}
      HISTORY_UPSERT_TIMEOUT_SPLIT_MIN_ROWS: ${{ vars.HISTORY_UPSERT_TIMEOUT_SPLIT_MIN_ROWS || '32' }}
      HISTORY_UPSERT_TIMEOUT_SPLIT_MAX_DEPTH: ${{ vars.HISTORY_UPSERT_TIMEOUT_SPLIT_MAX_DEPTH || '4' }}
      HISTORY_OUTBOX_CLOUD_RUN_MAX_BATCHES: ${{ vars.HISTORY_OUTBOX_CLOUD_RUN_MAX_BATCHES || '30' }}
      HISTORY_OUTBOX_CLOUD_RUN_CLAIM_BATCH_LIMIT: ${{ vars.HISTORY_OUTBOX_CLOUD_RUN_CLAIM_BATCH_LIMIT || '2' }}
      HISTORY_OUTBOX_CLOUD_RUN_BUDGET_SECONDS: ${{ vars.HISTORY_OUTBOX_CLOUD_RUN_BUDGET_SECONDS || '540' }}
      HISTORY_OUTBOX_CLOUD_RUN_SHUTDOWN_BUFFER_SECONDS: ${{ vars.HISTORY_OUTBOX_CLOUD_RUN_SHUTDOWN_BUFFER_SECONDS || '20' }}
      HISTORY_OUTBOX_CLOUD_RUN_RPC_RETRIES: ${{ vars.HISTORY_OUTBOX_CLOUD_RUN_RPC_RETRIES || '3' }}
      SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
      HISTORY_SECRET_KEY: ${{ secrets.HISTORY_SECRET_KEY }}
      SB_SECRET_KEY_SECRET_NAME: ${{ vars.SB_SECRET_KEY_SECRET_NAME || 'SB_SECRET_KEY' }}
      HISTORY_SECRET_KEY_SECRET_NAME: ${{ vars.HISTORY_SECRET_KEY_SECRET_NAME || 'HISTORY_SECRET_KEY' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project config
        run: |
          if [ -z "${PROJECT_ID:-}" ]; then
            echo "Missing required secret: GCP_PROJECT_ID"
            exit 1
          fi
          if [ -z "${JOB_SERVICE_ACCOUNT:-}" ]; then
            echo "Missing required service account setting."
            echo "Set repo variable: GCP_HISTORY_OUTBOX_JOB_SERVICE_ACCOUNT"
            exit 1
          fi
          if [[ "${JOB_SERVICE_ACCOUNT}" == *"-compute@developer.gserviceaccount.com" ]]; then
            echo "Invalid GCP_HISTORY_OUTBOX_JOB_SERVICE_ACCOUNT: default compute service account is not allowed."
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing required secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "${HISTORY_SUPABASE_URL:-}" ]; then
            echo "Missing required secret: HISTORY_SUPABASE_URL"
            exit 1
          fi

      - name: Validate Google auth config
        run: |
          if [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ] && [ -n "${GCP_SERVICE_ACCOUNT:-}" ]; then
            echo "Using Workload Identity Federation auth."
          elif [ -n "${GCP_SA_KEY:-}" ]; then
            echo "Using Service Account key auth."
          else
            echo "Missing Google auth config."
            echo "Set either:"
            echo "1) GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT"
            echo "or"
            echo "2) GCP_SA_KEY"
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key fallback)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Configure gcloud project
        run: |
          gcloud config set project "${PROJECT_ID}"
          gcloud config set run/region "${REGION}"

      - name: Verify Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${REPO}" \
            --location "${REGION}" \
            --project "${PROJECT_ID}" >/dev/null

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push history outbox image
        id: build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/uk-aq-history-outbox:${GITHUB_SHA::12}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          docker build -f workers/uk_aq_history_outbox_cloud_run/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Ensure Cloud Run job exists
        run: |
          set -euo pipefail
          if gcloud run jobs describe "${JOB_NAME}" --region "${REGION}" >/dev/null 2>&1; then
            echo "Cloud Run job exists: ${JOB_NAME}"
            exit 0
          fi

          gcloud run jobs create "${JOB_NAME}" \
            --region "${REGION}" \
            --image "${{ steps.build.outputs.image }}" \
            --task-timeout "${JOB_TIMEOUT_SECONDS}s" \
            --max-retries "${JOB_MAX_RETRIES}" \
            --service-account "${JOB_SERVICE_ACCOUNT}"

      - name: Sync GitHub secrets to GCP Secret Manager
        run: |
          set -euo pipefail
          UPSERT_SCRIPT="scripts/gcp/uk_aq_secret_upsert_if_changed.sh"

          upsert_secret() {
            local secret_name="$1"
            local secret_value="$2"
            local required="${3:-0}"

            if [ -z "${secret_name}" ]; then
              if [ "${required}" = "1" ]; then
                echo "Missing required secret name."
                exit 1
              fi
              return 0
            fi

            if [ -z "${secret_value}" ] && [ "${required}" = "0" ]; then
              echo "Skipping optional secret ${secret_name} (no GitHub secret/variable value)."
              return 0
            fi

            printf '%s' "${secret_value}" | "${UPSERT_SCRIPT}" \
              --project "${PROJECT_ID}" \
              --secret "${secret_name}" \
              --required "${required}"
          }

          upsert_secret "${SB_SECRET_KEY_SECRET_NAME}" "${SB_SECRET_KEY}" 1
          upsert_secret "${HISTORY_SECRET_KEY_SECRET_NAME}" "${HISTORY_SECRET_KEY}" 1

      - name: Build Cloud Run env and secret args
        id: cloudrun_args
        run: |
          set -euo pipefail

          require_env() {
            local key="$1"
            local value="${!key:-}"
            if [ -z "${value}" ]; then
              echo "Missing required value for ${key}"
              exit 1
            fi
          }

          add_env() {
            local key="$1"
            local value="${!key:-}"
            if [ -n "${value}" ]; then
              env_updates+=("${key}=${value}")
            fi
          }

          add_secret_binding() {
            local env_key="$1"
            local secret_name="$2"
            local required="${3:-0}"
            if [ -z "${secret_name}" ]; then
              if [ "${required}" = "1" ]; then
                echo "Missing secret name for required binding ${env_key}"
                exit 1
              fi
              return 0
            fi
            if gcloud secrets describe "${secret_name}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
              secret_updates+=("${env_key}=${secret_name}:latest")
              return 0
            fi
            if [ "${required}" = "1" ]; then
              echo "Required Secret Manager secret not found: ${secret_name}"
              exit 1
            fi
          }

          require_env SUPABASE_URL
          require_env HISTORY_SUPABASE_URL

          env_updates=()
          add_env SUPABASE_URL
          add_env HISTORY_SUPABASE_URL
          add_env UK_AQ_PUBLIC_SCHEMA
          add_env HISTORY_SCHEMA
          add_env HISTORY_UPSERT_RPC
          add_env HISTORY_OUTBOX_FLUSH_LIMIT
          add_env HISTORY_UPSERT_CHUNK_SIZE
          add_env HISTORY_UPSERT_RPC_RETRIES
          add_env HISTORY_UPSERT_RETRY_BASE_MS
          add_env HISTORY_UPSERT_TIMEOUT_SPLIT_MIN_ROWS
          add_env HISTORY_UPSERT_TIMEOUT_SPLIT_MAX_DEPTH
          add_env HISTORY_OUTBOX_CLOUD_RUN_MAX_BATCHES
          add_env HISTORY_OUTBOX_CLOUD_RUN_CLAIM_BATCH_LIMIT
          add_env HISTORY_OUTBOX_CLOUD_RUN_BUDGET_SECONDS
          add_env HISTORY_OUTBOX_CLOUD_RUN_SHUTDOWN_BUFFER_SECONDS
          add_env HISTORY_OUTBOX_CLOUD_RUN_RPC_RETRIES

          secret_updates=()
          add_secret_binding "SB_SECRET_KEY" "${SB_SECRET_KEY_SECRET_NAME}" 1
          add_secret_binding "HISTORY_SECRET_KEY" "${HISTORY_SECRET_KEY_SECRET_NAME}" 1

          env_csv="$(IFS=,; echo "${env_updates[*]}")"
          secret_csv="$(IFS=,; echo "${secret_updates[*]}")"
          echo "env_csv=${env_csv}" >> "${GITHUB_OUTPUT}"
          echo "secret_csv=${secret_csv}" >> "${GITHUB_OUTPUT}"

      - name: Determine whether Cloud Run update is required
        id: cloudrun_diff
        run: |
          set -euo pipefail
          ENV_CSV='${{ steps.cloudrun_args.outputs.env_csv }}'
          SECRET_CSV='${{ steps.cloudrun_args.outputs.secret_csv }}'
          JOB_JSON="${RUNNER_TEMP}/${JOB_NAME}-current.json"
          gcloud run jobs describe "${JOB_NAME}" --region "${REGION}" --format=json > "${JOB_JSON}"

          needs_update="$(python3 scripts/gcp/uk_aq_cloud_run_job_has_changes.py \
            --job-json "${JOB_JSON}" \
            --image "${{ steps.build.outputs.image }}" \
            --task-timeout-seconds "${JOB_TIMEOUT_SECONDS}" \
            --max-retries "${JOB_MAX_RETRIES}" \
            --service-account "${JOB_SERVICE_ACCOUNT}" \
            --env-csv "${ENV_CSV}" \
            --secret-csv "${SECRET_CSV}" \
            --label-csv "job_name=${JOB_NAME}" \
            --verbose)"
          echo "needs_update=${needs_update}" >> "${GITHUB_OUTPUT}"

      - name: Update Cloud Run job image
        if: ${{ steps.cloudrun_diff.outputs.needs_update == 'true' }}
        run: |
          set -euo pipefail
          ENV_CSV='${{ steps.cloudrun_args.outputs.env_csv }}'
          SECRET_CSV='${{ steps.cloudrun_args.outputs.secret_csv }}'

          CMD=(
            gcloud run jobs update "${JOB_NAME}"
            --region "${REGION}"
            --image "${{ steps.build.outputs.image }}"
            --task-timeout "${JOB_TIMEOUT_SECONDS}s"
            --max-retries "${JOB_MAX_RETRIES}"
            --service-account "${JOB_SERVICE_ACCOUNT}"
            --update-labels "job_name=${JOB_NAME}"
          )
          if [ -n "${ENV_CSV}" ]; then
            CMD+=(--set-env-vars "${ENV_CSV}")
          fi
          if [ -n "${SECRET_CSV}" ]; then
            CMD+=(--set-secrets "${SECRET_CSV}")
          fi
          "${CMD[@]}"

      - name: Skip Cloud Run job update
        if: ${{ steps.cloudrun_diff.outputs.needs_update != 'true' }}
        run: |
          echo "Cloud Run job is already up to date; skipping update."

      - name: Verify Cloud Run job labels
        run: |
          set -euo pipefail
          labels_json="$(gcloud run jobs describe "${JOB_NAME}" --region "${REGION}" --format="json(metadata.labels)")"
          job_name_label="$(
            python3 -c 'import json,sys; print(((json.loads(sys.stdin.read()) or {}).get("metadata", {}) or {}).get("labels", {}).get("job_name", ""))' <<<"${labels_json}"
          )"
          if [ "${job_name_label}" != "${JOB_NAME}" ]; then
            echo "job_name label mismatch: expected ${JOB_NAME}, got ${job_name_label:-<missing>}"
            exit 1
          fi
          echo "Verified label job_name=${job_name_label}"

      - name: Ensure Cloud Scheduler trigger exists
        run: |
          set -euo pipefail

          enabled="$(printf '%s' "${SCHEDULER_ENABLED}" | tr '[:upper:]' '[:lower:]')"
          if [ "${enabled}" != "true" ] && [ "${enabled}" != "1" ] && [ "${enabled}" != "yes" ]; then
            echo "Skipping scheduler trigger management (SCHEDULER_ENABLED=${SCHEDULER_ENABLED})."
            exit 0
          fi

          scheduler_sa="${SCHEDULER_SERVICE_ACCOUNT:-uk-aq-scheduler-invoker@${PROJECT_ID}.iam.gserviceaccount.com}"
          run_uri="https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/jobs/${JOB_NAME}:run"

          gcloud run jobs add-iam-policy-binding "${JOB_NAME}" \
            --region "${REGION}" \
            --member "serviceAccount:${scheduler_sa}" \
            --role "roles/run.invoker" >/dev/null

          if gcloud scheduler jobs describe "${SCHEDULER_JOB_NAME}" --location "${REGION}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "${SCHEDULER_JOB_NAME}" \
              --location "${REGION}" \
              --schedule "${SCHEDULER_CRON}" \
              --time-zone "${SCHEDULER_TIMEZONE}" \
              --uri "${run_uri}" \
              --http-method POST \
              --oauth-service-account-email "${scheduler_sa}" \
              --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
              --max-retry-attempts "${SCHEDULER_MAX_RETRY_ATTEMPTS}"
          else
            gcloud scheduler jobs create http "${SCHEDULER_JOB_NAME}" \
              --location "${REGION}" \
              --schedule "${SCHEDULER_CRON}" \
              --time-zone "${SCHEDULER_TIMEZONE}" \
              --uri "${run_uri}" \
              --http-method POST \
              --oauth-service-account-email "${scheduler_sa}" \
              --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
              --max-retry-attempts "${SCHEDULER_MAX_RETRY_ATTEMPTS}"
          fi

      - name: Show deployed job
        run: |
          gcloud run jobs describe "${JOB_NAME}" \
            --region "${REGION}" \
            --format="yaml(name,template.template.serviceAccount,template.template.containers[0].image,template.template.timeoutSeconds)"
