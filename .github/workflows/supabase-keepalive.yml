name: Supabase Keepalive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run keepalive
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SB_PUBLISHABLE_DEFAULT_KEY }}
          KEEPALIVE_TABLE: ${{ secrets.KEEPALIVE_TABLE }}
          KEEPALIVE_SELECT: ${{ secrets.KEEPALIVE_SELECT }}
        run: npm run keepalive
