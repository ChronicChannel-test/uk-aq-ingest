name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/uk_aq_polling_cron.sql"
  workflow_dispatch:

jobs:
  deploy-edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Inject project ref into web page
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          SUPABASE_ANON_JWT: ${{ secrets.SUPABASE_ANON_JWT }}
        run: |
          node scripts/uk_aq_inject_project_ref.mjs

      - name: Set Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set \
            SB_SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SB_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            SB_UK_AQ_CRON_SECRET="${{ secrets.SB_UK_AQ_CRON_SECRET }}" \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ingest_uk_air_sos \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy ingest_breathelondon \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy ingest_sensorcommunity \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_latest \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_bristol_latest \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_la_hex \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_pcon_hex \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_stations \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_timeseries \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Apply cron schedules
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ANON_JWT: ${{ secrets.SUPABASE_ANON_JWT }}
          SB_UK_AQ_CRON_SECRET: ${{ secrets.SB_UK_AQ_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is required to apply cron schedules."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_JWT" ]; then
            echo "SUPABASE_ANON_JWT is required to apply cron schedules."
            exit 1
          fi
          if [ -z "$SB_UK_AQ_CRON_SECRET" ]; then
            echo "SB_UK_AQ_CRON_SECRET is required to apply cron schedules."
            exit 1
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          CRON_SQL_OUT="$(mktemp)"
          CRON_DB_URL_OUT="$(mktemp)"
          export CRON_SQL_OUT CRON_DB_URL_OUT
          python3 - <<'PY'
          import os
          import socket
          import urllib.parse

          path = "supabase/uk_aq_polling_cron.sql"
          with open(path, "r", encoding="utf-8") as handle:
              sql = handle.read()
          for key in ("SUPABASE_ANON_JWT", "SB_UK_AQ_CRON_SECRET"):
              value = os.environ.get(key)
              if not value:
                  raise SystemExit(f"Missing {key}")
              sql = sql.replace(f"{{{{{key}}}}}", value)
          out = os.environ.get("CRON_SQL_OUT")
          if not out:
              raise SystemExit("Missing CRON_SQL_OUT")
          with open(out, "w", encoding="utf-8") as handle:
              handle.write(sql)

          db_url = os.environ.get("SUPABASE_DB_URL")
          if not db_url:
              raise SystemExit("Missing SUPABASE_DB_URL")
          parsed = urllib.parse.urlsplit(db_url)
          host = parsed.hostname
          if not host:
              raise SystemExit("SUPABASE_DB_URL missing host")
          try:
              infos = socket.getaddrinfo(host, parsed.port or 5432, socket.AF_INET, socket.SOCK_STREAM)
          except socket.gaierror as exc:
              raise SystemExit(
                  f"Failed to resolve IPv4 for {host}. Consider using the Supabase pooler connection string. ({exc})"
              )
          if not infos:
              raise SystemExit(f"No IPv4 address resolved for {host}. Consider using the pooler host.")
          ipv4 = infos[0][4][0]
          query = urllib.parse.parse_qsl(parsed.query, keep_blank_values=True)
          query.append(("hostaddr", ipv4))
          new_query = urllib.parse.urlencode(query)
          rebuilt = urllib.parse.urlunsplit((
              parsed.scheme,
              parsed.netloc,
              parsed.path,
              new_query,
              parsed.fragment,
          ))
          db_out = os.environ.get("CRON_DB_URL_OUT")
          if not db_out:
              raise SystemExit("Missing CRON_DB_URL_OUT")
          with open(db_out, "w", encoding="utf-8") as handle:
              handle.write(rebuilt)
          PY
          SUPABASE_DB_URL_IPV4="$(cat "$CRON_DB_URL_OUT")"
          rm -f "$CRON_DB_URL_OUT"
          if [ -z "$SUPABASE_DB_URL_IPV4" ]; then
            echo "SUPABASE_DB_URL_IPV4 is empty."
            exit 1
          fi
          psql "$SUPABASE_DB_URL_IPV4" -f "$CRON_SQL_OUT"
          rm -f "$CRON_SQL_OUT"
