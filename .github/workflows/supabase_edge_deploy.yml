name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/uk_aq_polling_cron.sql"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51
        with:
          version: latest

      - name: Inject project ref into web page
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SB_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.SB_PUBLISHABLE_DEFAULT_KEY }}
        run: |
          node scripts/uk_aq_inject_project_ref.mjs
      - name: Set Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SECRETS_ENV: ${{ secrets.SUPABASE_SECRETS_ENV }}
        run: |
          if [ -z "${SUPABASE_SECRETS_ENV:-}" ]; then
            echo "Missing SUPABASE_SECRETS_ENV secret." >&2
            exit 1
          fi
          printf '%s' "${SUPABASE_SECRETS_ENV}" > .env.supabase
          supabase secrets set             --env-file .env.supabase             --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"



      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ingest_uk_air_sos \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy ingest_breathelondon \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_latest \
            --no-verify-jwt \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_stations_chart \
            --no-verify-jwt \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_la_hex \
            --no-verify-jwt \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_pcon_hex \
            --no-verify-jwt \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_stations \
            --no-verify-jwt \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_timeseries \
            --no-verify-jwt \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_station_snapshot \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_egress_monitor \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy uk_aq_sync_openaq_from_live \
            --no-verify-jwt \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
