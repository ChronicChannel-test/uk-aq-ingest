name: UK-AQ Stations Daily Sync

permissions:
  contents: write

on:
  schedule:
    # GitHub schedules are UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync-stations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests python-dotenv supabase pyproj

      - name: Sync stations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UK_AIR_SOS_BASE_URL: ${{ secrets.UK_AIR_SOS_BASE_URL }}
        run: |
          python3 scripts/uk_air_sos_list_stations.py --to-supabase

      - name: Check null station_name
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import requests

          supabase_url = os.environ.get("SUPABASE_URL")
          supabase_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY")
          if not supabase_url or not supabase_key:
            raise SystemExit("SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are required.")

          def count_null(field, require_geometry=False):
            params = [f"select=id", f"{field}=is.null"]
            if require_geometry:
              params.append("geometry=not.is.null")
            url = f"{supabase_url}/rest/v1/stations?{'&'.join(params)}"
            resp = requests.get(
              url,
              headers={
                "apikey": supabase_key,
                "Authorization": f"Bearer {supabase_key}",
                "Prefer": "count=exact",
              },
              timeout=30,
            )
            resp.raise_for_status()
            content_range = resp.headers.get("content-range", "")
            match = re.search(r"/(\\d+)$", content_range)
            if not match:
              return 0
            return int(match.group(1))

          station_name_missing = count_null("station_name", require_geometry=False)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
            handle.write(f"STATION_NAME_NULL_COUNT={station_name_missing}\\n")
            handle.write(f"STATION_NAME_SHOULD_RUN={'1' if station_name_missing > 0 else '0'}\\n")

          print(f"Missing station_name: {station_name_missing}")
          PY

      - name: Enrich station names
        if: env.STATION_NAME_SHOULD_RUN == '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          UK_AQ_OS_OPEN_NAMES_GB_DROPBOX_PATH: ${{ secrets.UK_AQ_OS_OPEN_NAMES_GB_DROPBOX_PATH }}
        run: |
          python3 scripts/uk_aq_enrich_station_names.py

      - name: Commit stations JSON
        run: |
          if git status --porcelain | grep -qE " (uk_aq_stations\\.json|sensorcommunity_stations\\.json)$"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uk_aq_stations.json sensorcommunity_stations.json
            git commit -m "chore: updated 2 station files"
            git push
          else
            echo "No changes to commit."
          fi
