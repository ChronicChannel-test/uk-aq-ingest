name: UK-AQ Stations Daily Sync

permissions:
  contents: write

on:
  schedule:
    # GitHub schedules are UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync-stations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests python-dotenv supabase

      - name: Sync stations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UK_AIR_SOS_BASE_URL: ${{ secrets.UK_AIR_SOS_BASE_URL }}
        run: |
          python3 scripts/uk_air_sos_list_stations.py --to-supabase

      - name: Commit stations JSON
        run: |
          if git status --porcelain | grep -q " uk_aq_stations.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uk_aq_stations.json
            git commit -m "chore: update uk_aq_stations.json"
            git push
          else
            echo "No changes to commit."
          fi
