name: Deploy uk_aq_history_outbox_flusher Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/uk_aq_history_outbox_flusher/**"
      - ".github/workflows/uk_aq_history_outbox_flusher_deploy.yml"
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker (base)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/uk_aq_history_outbox_flusher
          command: deploy

      - name: Set Worker secrets
        working-directory: workers/uk_aq_history_outbox_flusher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secrets_json="$(jq -n \
            --arg SUPABASE_URL "${{ secrets.SUPABASE_URL }}" \
            --arg SB_ANON_JWT "${{ secrets.SB_ANON_JWT }}" \
            --arg SB_UK_AQ_CRON_SECRET "${{ secrets.SB_UK_AQ_CRON_SECRET }}" \
            '{SUPABASE_URL: $SUPABASE_URL, SB_ANON_JWT: $SB_ANON_JWT, SB_UK_AQ_CRON_SECRET: $SB_UK_AQ_CRON_SECRET}')"
          for attempt in 1 2 3; do
            if printf "%s" "$secrets_json" | npx wrangler secret bulk; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to apply Worker secrets after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/uk_aq_history_outbox_flusher
          command: deploy
