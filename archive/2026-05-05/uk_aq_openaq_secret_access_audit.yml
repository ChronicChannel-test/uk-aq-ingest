name: OpenAQ Secret Access Audit

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  audit-openaq-secret-access:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_OPENAQ_JOB_SERVICE_ACCOUNT: ${{ vars.GCP_OPENAQ_JOB_SERVICE_ACCOUNT || '' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      OPENAQ_SECRET_NAME: OPENAQ_API_KEY
      OPENAQ_SECRET_AUDIT_FRESHNESS: ${{ vars.OPENAQ_SECRET_AUDIT_FRESHNESS || '7d' }}
      OPENAQ_SECRET_AUDIT_ALLOWED_PRINCIPALS: ${{ vars.OPENAQ_SECRET_AUDIT_ALLOWED_PRINCIPALS || '' }}
      OPENAQ_SECRET_AUDIT_REQUIRE_LOGS: ${{ vars.OPENAQ_SECRET_AUDIT_REQUIRE_LOGS || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate config
        run: |
          if [ -z "${PROJECT_ID:-}" ]; then
            echo "Missing required repo variable: GCP_PROJECT_ID"
            exit 1
          fi
          if [ -z "${GCP_OPENAQ_JOB_SERVICE_ACCOUNT:-}" ]; then
            echo "Missing required repo variable: GCP_OPENAQ_JOB_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Validate Google auth config
        run: |
          if [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ] && [ -n "${GCP_SERVICE_ACCOUNT:-}" ]; then
            echo "Using Workload Identity Federation auth."
          elif [ -n "${GCP_SA_KEY:-}" ]; then
            echo "Using Service Account key auth."
          else
            echo "Missing Google auth config."
            echo "Set either:"
            echo "1) GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT"
            echo "or"
            echo "2) GCP_SA_KEY"
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key fallback)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Audit OPENAQ_API_KEY access principals
        shell: bash
        run: |
          set -euo pipefail

          gcloud config set project "${PROJECT_ID}" >/dev/null

          allow_openaq="serviceAccount:${GCP_OPENAQ_JOB_SERVICE_ACCOUNT}"
          allow_deploy="serviceAccount:github-actions-deploy-uk-aq@${PROJECT_ID}.iam.gserviceaccount.com"

          declare -A allowed
          allowed["${allow_openaq}"]=1
          allowed["${allow_deploy}"]=1

          if [ -n "${OPENAQ_SECRET_AUDIT_ALLOWED_PRINCIPALS:-}" ]; then
            IFS=',' read -r -a extra <<< "${OPENAQ_SECRET_AUDIT_ALLOWED_PRINCIPALS}"
            for p in "${extra[@]}"; do
              p_trimmed="$(echo "$p" | xargs)"
              [ -n "$p_trimmed" ] && allowed["$p_trimmed"]=1
            done
          fi

          query='resource.type="secret_manager_secret" AND protoPayload.methodName="google.cloud.secretmanager.v1.SecretManagerService.AccessSecretVersion" AND protoPayload.resourceName:"/secrets/'"${OPENAQ_SECRET_NAME}"'/"'
          principals=$(gcloud logging read "$query" --project "${PROJECT_ID}" --freshness "${OPENAQ_SECRET_AUDIT_FRESHNESS}" --limit 500 --format=json \
            | jq -r '.[].protoPayload.authenticationInfo.principalEmail // empty' | sed '/^$/d' | sort -u)

          if [ -z "${principals}" ]; then
            echo "No Secret Manager access logs found for ${OPENAQ_SECRET_NAME} in freshness=${OPENAQ_SECRET_AUDIT_FRESHNESS}."
            require_logs="$(echo "${OPENAQ_SECRET_AUDIT_REQUIRE_LOGS}" | tr '[:upper:]' '[:lower:]')"
            if [ "${require_logs}" = "true" ] || [ "${require_logs}" = "1" ] || [ "${require_logs}" = "yes" ]; then
              echo "OPENAQ_SECRET_AUDIT_REQUIRE_LOGS=true, failing."
              exit 1
            fi
            exit 0
          fi

          echo "Observed principals:"
          echo "${principals}" | sed 's/^/  - /'

          unexpected=0
          while IFS= read -r principal; do
            [ -z "${principal}" ] && continue
            key="${principal}"
            # Cloud Audit logs usually provide raw email for service accounts; normalize to IAM member form.
            if [[ "${principal}" == *"@"* && "${principal}" != serviceAccount:* ]]; then
              key="serviceAccount:${principal}"
            fi
            if [ -z "${allowed["${key}"]+x}" ] && [ -z "${allowed["${principal}"]+x}" ]; then
              echo "Unexpected OPENAQ secret accessor: ${principal}"
              unexpected=1
            fi
          done <<< "${principals}"

          if [ "${unexpected}" -ne 0 ]; then
            echo "OpenAQ secret access audit failed."
            exit 1
          fi

          echo "OpenAQ secret access audit passed."
