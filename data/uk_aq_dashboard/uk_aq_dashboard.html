          refreshR2Button.addEventListener("click", () => {
            refreshR2MetricsOnly();
          });
        }

        return panel;
      }

      /**
       * @typedef {Object} DayCoverage
       * @property {string} date
       * @property {boolean} ingest
       * @property {boolean} observs
       * @property {boolean} r2
       * @property {boolean=} isToday
       */

      function normalizeDayCoverageRows(rows) {
        if (!Array.isArray(rows)) {
          return [];
        }
        return rows
          .map((row) => {
            const dateObj = parseUtcDateKey(row && row.date);
            if (!dateObj) {
              return null;
            }
            return {
              date: toUtcDateKey(dateObj),
              ingest: Boolean(row && row.ingest),
              observs: Boolean(row && row.observs),
              r2: Boolean(row && row.r2),
              isToday: Boolean(row && row.isToday),
            };
          })
          .filter(Boolean);
      }

      function resolveCoverageRowsForMonth(_monthStartUtc, serverCoverageRows) {
        const normalizedRows = normalizeDayCoverageRows(serverCoverageRows);
        return { rows: normalizedRows, source: "api" };
      }

      function buildCoverageCalendarCells(monthStartUtc, dayCoverageRows) {
        const todayKey = toUtcDateKey(startOfUtcDay(new Date()));
        const coverageByDate = new Map(
          dayCoverageRows.map((row) => [row.date, row]),
        );
        const monthEndUtc = addUtcDays(addUtcMonths(monthStartUtc, 1), -1);
        const leadingDays = (monthStartUtc.getUTCDay() + 6) % 7;
        const trailingDays = 6 - ((monthEndUtc.getUTCDay() + 6) % 7);
        const gridStartUtc = addUtcDays(monthStartUtc, -leadingDays);
        const gridEndUtc = addUtcDays(monthEndUtc, trailingDays);

        const cells = [];
        for (
          let cursor = new Date(gridStartUtc.getTime());
          cursor <= gridEndUtc;
          cursor = addUtcDays(cursor, 1)
        ) {
          const dateKey = toUtcDateKey(cursor);
          const weekdayIndex = (cursor.getUTCDay() + 6) % 7;
          const row = coverageByDate.get(dateKey) || {
            date: dateKey,
            ingest: false,
            observs: false,
            r2: false,
            isToday: dateKey === todayKey,
          };
          const isToday = Boolean(row.isToday) || dateKey === todayKey;
          cells.push({
            date: new Date(cursor.getTime()),
            dateKey,
            isInMonth: sameUtcMonth(cursor, monthStartUtc),
            dayNumber: cursor.getUTCDate(),
            weekdayLabel: COVERAGE_WEEKDAY_NAMES[weekdayIndex],
            coverage: {
              date: row.date,
              ingest: Boolean(row.ingest),
              observs: Boolean(row.observs),
              r2: Boolean(row.r2),
              isToday,
            },
          });
        }
        return cells;
      }

      function summarizeCoverageSources(coverage) {
        const sources = [];
        if (coverage.r2) {
          sources.push("Cloudflare R2");
        } else if (coverage.ingest) {
          sources.push("Ingest DB");
        }
        if (coverage.observs) {
          sources.push("Observs & AQI DB");
        }
        return sources;
      }

      function renderStorageCoverageCalendarPanel(serverCoverageRows) {
        const monthStartUtc = storageCoverageMonthCursor || startOfUtcMonth(new Date());
        const resolved = resolveCoverageRowsForMonth(monthStartUtc, serverCoverageRows);
        const calendarCells = buildCoverageCalendarCells(monthStartUtc, resolved.rows);
        const panel = document.createElement("section");
        panel.className = "panel coverage-calendar-panel";
        panel.dataset.panel = "storage-coverage";

        const cellsMarkup = calendarCells
          .map((cell) => {
            const topLayer = cell.coverage.r2
              ? { key: "r2", label: "Cloudflare R2", className: "coverage-bar-r2" }
              : cell.coverage.ingest
                ? { key: "ingest", label: "Ingest DB", className: "coverage-bar-ingest" }
                : null;
            const middleLayer = cell.coverage.observs
              ? { key: "observs", label: "Observs & AQI DB", className: "coverage-bar-observs" }
              : null;
            const cellSources = summarizeCoverageSources(cell.coverage);
            const dayTooltip = `${cell.dateKey} • ${
              cellSources.length ? `Sources: ${cellSources.join(", ")}` : "No data in storage layers"
            }`;
            const outsideClass = cell.isInMonth ? "" : " is-outside";
            const todayClass = cell.coverage.isToday ? " is-today" : "";

            const renderBar = (layer) => {
              if (!layer) return "";
              const halfClass = cell.coverage.isToday ? " is-half" : "";
              return `<span class="coverage-bar ${layer.className}${halfClass}" title="${escapeHtml(layer.label)}"></span>`;
            };

            return `
              <div class="coverage-day-cell${outsideClass}${todayClass}" title="${escapeHtml(dayTooltip)}">
                <div class="coverage-day-title">
                  <span class="coverage-day-number">${cell.dayNumber}</span>
                  <span class="coverage-day-weekday">${escapeHtml(cell.weekdayLabel)}</span>
                </div>
                <div class="coverage-bars">
                  <div class="coverage-bar-slot">${renderBar(topLayer)}</div>
                  <div class="coverage-bar-slot">${renderBar(middleLayer)}</div>
                </div>
              </div>
            `;
          })
          .join("");

        panel.innerHTML = `
          <div class="coverage-calendar-head">
            <h2 class="coverage-calendar-title">${escapeHtml(formatCoverageMonthTitle(monthStartUtc))}</h2>
            <div class="coverage-calendar-nav">
              <button type="button" class="settings-button r2-refresh-button" data-action="force-refresh">Force Refresh</button>
              <button type="button" class="coverage-calendar-nav-btn" data-action="prev-month">&lt; Previous</button>
              <button type="button" class="coverage-calendar-nav-btn" data-action="next-month">Next &gt;</button>
            </div>
          </div>
          <div class="coverage-calendar-grid">${cellsMarkup}</div>
          <div class="footnote">
            Top row: Ingest DB (red) or Cloudflare R2 (orange). Middle row: Observs & AQI DB (blue).
          </div>
        `;

        const handleMonthChange = (monthDelta) => {
          storageCoverageMonthCursor = addUtcMonths(monthStartUtc, monthDelta);
          try {
            localStorage.setItem(
              STORAGE_COVERAGE_MONTH_STORAGE_KEY,
              formatCoverageMonthStorageKey(storageCoverageMonthCursor),
            );
          } catch (_err) {
            // Ignore localStorage write failures.
          }
          const nextPanel = renderStorageCoverageCalendarPanel(serverCoverageRows);
          panel.replaceWith(nextPanel);
        };

        const forceRefreshButton = panel.querySelector('[data-action="force-refresh"]');
        const prevButton = panel.querySelector('[data-action="prev-month"]');
        const nextButton = panel.querySelector('[data-action="next-month"]');
        if (forceRefreshButton) {
          forceRefreshButton.addEventListener("click", async () => {
            forceRefreshButton.disabled = true;
            forceRefreshButton.textContent = "Force Refreshing...";
            try {
              await loadDashboard({ forceRefresh: true });
            } finally {
              if (document.body.contains(forceRefreshButton)) {
                forceRefreshButton.disabled = false;
                forceRefreshButton.textContent = "Force Refresh";
              }
            }
          });
        }
        if (prevButton) {
          prevButton.addEventListener("click", () => handleMonthChange(-1));
        }
        if (nextButton) {
          nextButton.addEventListener("click", () => handleMonthChange(1));
        }

        return panel;
      }

      function renderConnectorSettingsPanel(connectors) {
        const schedulerBackendAllowlist = new Set(["uk_air_sos", "sensorcommunity", "breathelondon", "openaq"]);
        const panel = document.createElement("section");
        panel.className = "panel";
        panel.innerHTML = `
          <h2>Polling settings <span class="chip">i</span></h2>
          <table>
            <thead>
              <tr>
                <th>Connector</th>
                <th>Poll enabled</th>
                <th>Interval (min)</th>
                <th>Window (hrs)</th>
                <th>Batch size</th>
                <th>Scheduler backend</th>
              </tr>
            </thead>
            <tbody>
              ${connectors
                .map((row) => {
                  const label = row.display_name || row.label || row.connector_code || "";
                  const enabled = row.poll_enabled === true
                    ? "true"
                    : row.poll_enabled === false
                      ? "false"
                      : "";
                  const interval = row.poll_interval_minutes ?? "";
                  const windowHours = row.poll_window_hours ?? "";
                  const batchSize = row.poll_timeseries_batch_size ?? "";
                  const connectorCode = row.connector_code || "";
                  const schedulerBackend = row.scheduler_backend || "supabase_function";
                  const schedulerDisabled = schedulerBackendAllowlist.has(connectorCode) ? "" : "disabled";
                  return `
                    <tr data-connector-id="${row.id}" data-connector-code="${connectorCode}">
                      <td class="connector-name">${label}</td>
                      <td>
                        <select class="settings-select" data-field="poll_enabled">
                          <option value="" ${enabled === "" ? "selected" : ""}>NULL</option>
                          <option value="true" ${enabled === "true" ? "selected" : ""}>TRUE</option>
                          <option value="false" ${enabled === "false" ? "selected" : ""}>FALSE</option>
                        </select>
                      </td>
                      <td>
                        <input class="settings-input" data-field="poll_interval_minutes" type="number" min="0" step="1" value="${interval}" />
                      </td>
                      <td>
                        <input class="settings-input" data-field="poll_window_hours" type="number" min="0" step="1" value="${windowHours}" />
                      </td>
                      <td>
                        <input class="settings-input" data-field="poll_timeseries_batch_size" type="number" min="0" step="1" value="${batchSize}" />
                      </td>
                      <td>
                        <select class="settings-select" data-field="scheduler_backend" ${schedulerDisabled}>
                          <option value="supabase_function" ${schedulerBackend === "supabase_function" ? "selected" : ""}>supabase_function</option>
                          <option value="google_cloud_run" ${schedulerBackend === "google_cloud_run" ? "selected" : ""}>google_cloud_run</option>
                        </select>
                      </td>
                    </tr>
                  `;
                })
                .join("")}
            </tbody>
          </table>
          <div class="footnote">Scheduler backend toggle is currently active for UK-AIR SOS, Sensor.Community, Breathe London, and OpenAQ.</div>
          <div class="settings-actions">
            <button class="settings-button" id="commit-settings">Commit changes</button>
          </div>
        `;

        const commitButton = panel.querySelector("#commit-settings");
        if (commitButton) {
          commitButton.addEventListener("click", async () => {
            const rows = Array.from(panel.querySelectorAll("tbody tr"));
            const updates = rows.map((rowEl) => {
              const connectorId = rowEl.getAttribute("data-connector-id");
              const connectorCode = rowEl.getAttribute("data-connector-code");
              const getValue = (field) => {
                const input = rowEl.querySelector(`[data-field="${field}"]`);
                return input ? input.value : "";
              };
              const parseOptionalNumber = (value) => {
                if (value === "" || value === null || value === undefined) return null;
                const parsed = Number(value);
                return Number.isFinite(parsed) ? Math.floor(parsed) : null;
              };
              const enabled = getValue("poll_enabled");
              return {
                id: connectorId ? Number(connectorId) : null,
                connector_code: connectorCode || null,
                poll_enabled: enabled === "true" ? true : enabled === "false" ? false : null,
                poll_interval_minutes: parseOptionalNumber(getValue("poll_interval_minutes")),
                poll_window_hours: parseOptionalNumber(getValue("poll_window_hours")),
                poll_timeseries_batch_size: parseOptionalNumber(getValue("poll_timeseries_batch_size")),
                scheduler_backend: getValue("scheduler_backend") || "supabase_function",
              };
            }).filter((row) => row.id !== null);

            setError("");
            setStatus("Saving settings...");
            try {
              const resp = await fetch("/api/connectors", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ updates }),
              });
              if (!resp.ok) {
                const text = await resp.text();
                throw new Error(text || `Request failed (${resp.status})`);
              }
              await loadDashboard();
            } catch (err) {
              setError(err.message || String(err));
              setStatus("Error");
            }
          });
        }
        return panel;
      }

      function renderDispatcherSettingsPanel(settings) {
        const panel = document.createElement("section");
        panel.className = "panel";
        const parallel = Boolean(settings.dispatcher_parallel_ingest);
        const maxRuns = Number.isFinite(Number(settings.max_runs_per_dispatch_call))
          ? Number(settings.max_runs_per_dispatch_call)
          : 1;
        const updatedAt = settings.updated_at ? formatTime(settings.updated_at) : "n/a";
        panel.innerHTML = `
          <h2>Supabase Edge Functions Dispatcher Settings <span class="chip">i</span></h2>
          <div class="settings-inline">
            <label class="settings-toggle">
              <input type="checkbox" id="dispatcher-parallel" ${parallel ? "checked" : ""} />
              Parallel ingest
            </label>
            <label>
              Max runs per call
              <input class="settings-input" id="dispatcher-max-runs" type="number" min="1" step="1" value="${maxRuns}" />
            </label>
            <span class="meta-note">Last updated: ${updatedAt}</span>
          </div>
          <div class="settings-actions">
            <button class="settings-button" id="commit-dispatcher-settings">Save dispatcher settings</button>
          </div>
        `;

        const commitButton = panel.querySelector("#commit-dispatcher-settings");
        if (commitButton) {
          commitButton.addEventListener("click", async () => {
            const parallelEl = panel.querySelector("#dispatcher-parallel");
            const maxRunsEl = panel.querySelector("#dispatcher-max-runs");
            const maxRunsValue = maxRunsEl ? Number(maxRunsEl.value) : 1;
            setError("");
            setStatus("Saving dispatcher settings...");
            try {
              const resp = await fetch("/api/dispatcher_settings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  dispatcher_parallel_ingest: Boolean(parallelEl && parallelEl.checked),
                  max_runs_per_dispatch_call: Number.isFinite(maxRunsValue) ? maxRunsValue : 1,
                }),
              });
              if (!resp.ok) {
                const text = await resp.text();
                throw new Error(text || `Request failed (${resp.status})`);
              }
              await loadDashboard();
            } catch (err) {
              setError(err.message || String(err));
              setStatus("Error");
            }
          });
        }

        return panel;
      }

      function shouldShowDispatcherSettings(connectors) {
        if (!Array.isArray(connectors) || connectors.length === 0) {
          return true;
        }
        const allGoogleCloudRun = connectors.every((row) => {
          const backend = String(
            (row && row.scheduler_backend) || "supabase_function"
          ).toLowerCase();
          return backend === "google_cloud_run";
        });
        return !allGoogleCloudRun;
      }

      async function loadDashboard(options = {}) {
        const forceRefresh = Boolean(options.forceRefresh);
        setError("");
        setStatus(forceRefresh ? "Force refreshing..." : "Loading...");
        try {
          const params = new URLSearchParams();
          params.set("t", String(Date.now()));
          if (forceRefresh) {
            params.set("force", "1");
          }
          if (dispatchCursor) {
            params.set("dispatch_cursor", dispatchCursor);
          }
          const resp = await fetch(`/api/dashboard?${params.toString()}`);
          const text = await resp.text();
          let payload = null;
          try {
            payload = JSON.parse(text);
          } catch (err) {
            payload = null;
          }
          if (!resp.ok) {
            const message =
              (payload && (payload.error || payload.message)) ||
              text ||
              `Request failed (${resp.status})`;
            throw new Error(message);
          }
          const data = payload || {};
          latestDashboardData = data;
          if (typeof data.dispatch_cursor === "string" && data.dispatch_cursor) {
            dispatchCursor = data.dispatch_cursor;
            try {
              localStorage.setItem(DISPATCH_CURSOR_STORAGE_KEY, dispatchCursor);
            } catch (_err) {
              // Ignore storage write issues.
            }
          }
          dashboardEl.innerHTML = "";
          if (Array.isArray(data.connectors_settings)) {
            dashboardEl.appendChild(renderConnectorSettingsPanel(data.connectors_settings));
          }
          if (
            data.dispatcher_settings &&
            shouldShowDispatcherSettings(data.connectors_settings)
          ) {
            dashboardEl.appendChild(renderDispatcherSettingsPanel(data.dispatcher_settings));
          }
          if (Array.isArray(data.dispatch_runs)) {
            dashboardEl.appendChild(renderDispatchPanel(data.dispatch_runs));
          }
          data.pollutants.forEach((pollutant) => {
            dashboardEl.appendChild(renderPanel(pollutant));
          });
          dashboardEl.appendChild(
            renderDbSizePanel(
              data.db_size_metrics,
              data.db_size_metrics_error,
              data.schema_size_metrics,
              data.schema_size_metrics_error,
              data.r2_domain_size_metrics,
              data.r2_domain_size_metrics_error,
              data.r2_usage,
              data.r2_usage_error,
              data.r2_backup_window,
              data.r2_backup_window_error,
            ),
          );
          dashboardEl.appendChild(
            renderStorageCoverageCalendarPanel(data.storage_coverage_days),
          );
          if (forceRefresh) {
            setStatus(`Force refreshed ${formatTime(data.generated_at)} (local time)`);
          } else {
            setStatus(`Updated ${formatTime(data.generated_at)} (local time)`);
          }
          setDataMeta(data);
        } catch (err) {
          setError(err.message || String(err));
          setStatus("Error");
        }
      }

      refreshGroup.addEventListener("change", (event) => {
        if (event.target && event.target.name === "refresh") {
          const value = Number(event.target.value);
          if (Number.isFinite(value) && value > 0) {
            setRefreshInterval(value);
          }
        }
      });

      refreshNowBtn.addEventListener("click", () => {
        loadDashboard();
      });

      document.addEventListener("visibilitychange", handleActivityChange);
      window.addEventListener("focus", handleActivityChange);
      window.addEventListener("blur", handleActivityChange);

      setRefreshInterval(refreshSeconds);
      if (isPageActive()) {
        loadDashboard();
      }
    </script>
  </body>
</html>
