<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UK AQ Local Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-base: #f9f3e7;
        --bg-accent: #f4e3c2;
        --ink: #1f1c16;
        --ink-soft: #4b443a;
        --card: #fffaf1;
        --border: #e4d6be;
        --accent: #d0632c;
        --accent-2: #1f7a7a;
        --accent-3: #87562c;
        --accent-4: #a8b2c1;
        --accent-5: #d8c8a8;
        --shadow: 0 20px 40px rgba(34, 24, 12, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 20%, rgba(214, 115, 44, 0.15), transparent 50%),
          radial-gradient(circle at 80% 0%, rgba(31, 122, 122, 0.18), transparent 45%),
          linear-gradient(135deg, var(--bg-base), var(--bg-accent));
        min-height: 100vh;
        padding: 32px 20px 40px;
      }

      .shell {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        gap: 24px;
        position: relative;
      }

      header {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px 24px 20px;
        box-shadow: var(--shadow);
        display: grid;
        gap: 16px;
        animation: float-in 0.6s ease both;
      }

      header h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 38px);
        letter-spacing: -0.02em;
      }

      header p {
        margin: 0;
        color: var(--ink-soft);
        max-width: 740px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 16px 24px;
        align-items: center;
      }

      .meta-left {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .meta-status {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(31, 122, 122, 0.1);
        color: var(--accent-2);
      }

      .meta-note {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(32, 29, 29, 0.06);
        color: var(--ink-soft);
      }

      .refresh-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
      }

      .refresh-controls span {
        font-weight: 600;
        color: var(--ink-soft);
      }

      .refresh-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .refresh-pill {
        position: relative;
      }

      .refresh-pill input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .refresh-pill label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .refresh-pill input:checked + label {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }

      .refresh-button {
        border: none;
        background: var(--accent);
        color: #fff;
        padding: 8px 14px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .refresh-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(208, 99, 44, 0.25);
      }

      .grid {
        display: grid;
        gap: 22px;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 20px 22px 24px;
        box-shadow: var(--shadow);
        animation: rise-in 0.55s ease both;
      }

      .panel h2 {
        margin: 0 0 14px;
        font-size: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .chip {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(208, 99, 44, 0.12);
        color: var(--accent);
      }

      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .dispatch-filters {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .dispatch-filter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-soft);
        font-size: 12px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }

      .dispatch-filter select {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        padding: 6px 9px;
        font-size: 13px;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
      }

      .db-size-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 10px;
      }

      .db-size-item {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .db-size-item-title {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .db-size-item-min {
        padding-left: 18px;
        font-size: 11px;
        color: #6b6255;
      }

      .db-size-oldest-row {
        margin: 2px 0 12px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .db-size-swatch {
        width: 12px;
        height: 12px;
        border-radius: 999px;
      }

      .db-size-chart-wrap {
        width: 100%;
        height: 290px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.68);
        overflow: hidden;
        position: relative;
      }

      .db-size-chart {
        width: 100%;
        height: 100%;
        display: block;
      }

      .db-size-tooltip-hit {
        cursor: pointer;
      }

      .db-size-hover-tooltip {
        position: absolute;
        left: 0;
        top: 0;
        transform: translateX(-50%);
        background: rgba(31, 28, 22, 0.94);
        color: #fff;
        border-radius: 10px;
        padding: 7px 9px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px;
        line-height: 1.35;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        z-index: 4;
      }

      .db-size-hover-tooltip.visible {
        opacity: 1;
        visibility: visible;
      }

      .db-size-hover-tooltip div + div {
        margin-top: 2px;
      }

      .db-size-empty {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-soft);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
      }

      .db-size-subchart {
        margin-top: 12px;
      }

      .db-size-subchart h3 {
        margin: 0 0 8px;
        font-size: 13px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
      }

      .db-size-sublegend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .r2-usage-wrap {
        margin-top: 12px;
        display: grid;
        gap: 10px;
      }

      .r2-window-heading {
        font-weight: 600;
        color: var(--ink-soft);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }

      .r2-usage-row {
        display: grid;
        gap: 6px;
      }

      .r2-usage-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .r2-usage-bar {
        height: 12px;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.85);
      }

      .r2-usage-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--accent-2);
        transition: width 0.25s ease;
      }

      .r2-usage-sub {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px;
        color: var(--ink-soft);
      }

      .r2-usage-sub-split {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .r2-usage-sub-right {
        margin-left: auto;
        text-align: right;
        white-space: nowrap;
      }

      .r2-usage-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .r2-usage-meta .r2-usage-sub {
        margin-right: auto;
      }

      .r2-refresh-button {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 10px;
      }

      .coverage-calendar-panel {
        background: #ffffff;
        border-color: #d7d7d7;
        box-shadow: 0 12px 28px rgba(22, 20, 16, 0.1);
      }

      .coverage-calendar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      .coverage-calendar-title {
        margin: 0;
        font-size: clamp(26px, 3.6vw, 44px);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .coverage-calendar-nav {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .coverage-calendar-nav-btn {
        border: none;
        border-radius: 12px;
        background: #151515;
        color: #ffffff;
        font-family: "IBM Plex Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 14px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .coverage-calendar-nav-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 0 3px rgba(31, 122, 122, 0.22), 0 8px 16px rgba(22, 20, 16, 0.3);
      }

      .coverage-calendar-nav-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(31, 122, 122, 0.28), 0 8px 16px rgba(22, 20, 16, 0.3);
      }

      .coverage-calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }

      .coverage-day-cell {
        min-height: 124px;
        border: 1px solid #dddddd;
        border-radius: 12px;
        background: #ffffff;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .coverage-day-cell.is-outside {
        background: #f6f6f6;
        color: #9b9489;
      }

      .coverage-day-cell.is-outside .coverage-day-weekday {
        color: #8f877b;
      }

      .coverage-day-cell.is-today {
        border-color: #1f1c16;
        box-shadow: inset 0 0 0 1px #1f1c16;
      }

      .coverage-day-title {
        display: flex;
        align-items: baseline;
        gap: 6px;
        line-height: 1.1;
      }

      .coverage-day-number {
        font-size: 21px;
        font-weight: 700;
      }

      .coverage-day-weekday {
        font-size: 13px;
        color: #4a4a4a;
      }

      .coverage-bars {
        margin-top: 0;
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .coverage-bar-slot {
        min-height: 0;
        display: flex;
        align-items: center;
      }

      .coverage-bar {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 10px;
        border-radius: 999px;
      }

      .coverage-bar.is-half {
        width: 48%;
      }

      .coverage-bar-ingest {
        background: #ff2d2d;
      }

      .coverage-bar-observs {
        background: #3b82f6;
      }

      .coverage-bar-r2 {
        background: #F58121;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: rgba(31, 122, 122, 0.12);
        color: var(--accent-2);
      }

      .status-pill.succeeded {
        background: rgba(47, 143, 91, 0.15);
        color: #2f8f5b;
      }

      .status-pill.failed,
      .status-pill.error {
        background: rgba(211, 74, 63, 0.16);
        color: #b0322a;
      }

      .status-pill.skipped {
        background: rgba(245, 193, 74, 0.18);
        color: #a56800;
      }

      .status-pill.running {
        background: rgba(31, 122, 122, 0.14);
        color: var(--accent-2);
      }

      .status-pill.partial {
        background: rgba(47, 143, 91, 0.15);
        color: #2f8f5b;
        text-transform: none;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        line-height: 1.1;
        text-align: center;
      }

      .status-stack {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .status-detail {
        white-space: nowrap;
      }

      .runtime-pill {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(245, 193, 74, 0.18);
        color: #a56800;
      }

      .runtime-pill.overdue {
        background: rgba(211, 74, 63, 0.16);
        color: #b0322a;
      }

      .metric-note {
        display: inline-block;
        max-width: 88px;
        line-height: 1.2;
        color: var(--ink-soft);
      }

      .settings-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }

      .settings-inline {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .settings-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }

      .settings-button {
        border: none;
        background: var(--accent-2);
        color: #fff;
        padding: 8px 14px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .settings-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(31, 122, 122, 0.25);
      }

      .settings-input,
      .settings-select {
        width: 100%;
        padding: 6px 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fff;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
      }

      th {
        font-weight: 600;
        color: var(--ink-soft);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      tbody tr:hover {
        background: rgba(244, 227, 194, 0.45);
      }

      .connector-name {
        font-weight: 600;
      }

      .bucket-bar {
        display: flex;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: #efe4cf;
        min-width: 140px;
      }

      .seg {
        height: 100%;
      }

      .seg-0 {
        background: #2f8f5b;
      }

      .seg-1 {
        background: #f5c14a;
      }

      .seg-2 {
        background: #e57a2f;
      }

      .seg-3 {
        background: #d34a3f;
      }

      .seg-4 {
        background: #7b3bb5;
      }

      .footnote {
        margin-top: 8px;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .error {
        margin-top: 8px;
        color: #9b2c2c;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
      }

      @keyframes float-in {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 900px) {
        th:nth-child(n + 5),
        td:nth-child(n + 5) {
          display: none;
        }

        .db-size-chart-wrap {
          height: 240px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>UK AQ Local Dashboard</h1>
        <p>
          Live snapshot of PM2.5, PM10, and NO2 freshness using timeseries last_value_at. Data updates
          from your local API.
        </p>
        <div class="meta">
          <div class="meta-left">
            <span class="meta-status" id="status">Waiting for data...</span>
            <span class="meta-note" id="data-meta">Project n/a • Data n/a</span>
          </div>
          <div class="refresh-controls">
            <span>Refresh</span>
            <div class="refresh-group" id="refresh-group">
              <span class="refresh-pill">
                <input type="radio" name="refresh" id="refresh-1" value="60" />
                <label for="refresh-1">1 min</label>
              </span>
              <span class="refresh-pill">
                <input type="radio" name="refresh" id="refresh-5" value="300" checked />
                <label for="refresh-5">5 min</label>
              </span>
              <span class="refresh-pill">
                <input type="radio" name="refresh" id="refresh-10" value="600" />
                <label for="refresh-10">10 min</label>
              </span>
              <span class="refresh-pill">
                <input type="radio" name="refresh" id="refresh-30" value="1800" />
                <label for="refresh-30">30 min</label>
              </span>
              <span class="refresh-pill">
                <input type="radio" name="refresh" id="refresh-60" value="3600" />
                <label for="refresh-60">60 min</label>
              </span>
            </div>
            <button class="refresh-button" id="refresh-now">Refresh now</button>
          </div>
        </div>
        <div class="error" id="error"></div>
      </header>

      <div class="grid" id="dashboard"></div>
    </div>

    <script>
      const dashboardEl = document.getElementById("dashboard");
      const statusEl = document.getElementById("status");
      const dataMetaEl = document.getElementById("data-meta");
      const errorEl = document.getElementById("error");
      const refreshGroup = document.getElementById("refresh-group");
      const refreshNowBtn = document.getElementById("refresh-now");
      let refreshTimer = null;
      let refreshSeconds = 300;
      let wasInactive = document.hidden || !document.hasFocus();

      const bucketOrder = ["0-3 Hours", "3-6 Hours", "6-24 Hours", "1 - 7 Days", "Older than 7 Days"];
      const DISPATCH_CONNECTOR_OPTIONS = [
        { value: "all", label: "All" },
        { value: "uk_air_sos", label: "UK-AIR SOS" },
        { value: "sensorcommunity", label: "Sensor.Community" },
        { value: "breathelondon", label: "Breathe London" },
        { value: "openaq", label: "OpenAQ" },
      ];
      const DISPATCH_LOOKBACK_OPTIONS = [
        { value: 10, label: "10mins" },
        { value: 30, label: "30mins" },
        { value: 60, label: "60mins" },
        { value: 120, label: "120mins" },
        { value: 240, label: "240mins" },
      ];
      const DISPATCH_CONNECTOR_STORAGE_KEY = "uk_aq_dispatch_connector";
      const DISPATCH_LOOKBACK_STORAGE_KEY = "uk_aq_dispatch_lookback_mins";
      const DISPATCH_CURSOR_STORAGE_KEY = "uk_aq_dispatch_cursor";
      const DB_SIZE_PERIOD_OPTIONS = [
        { value: 6, label: "6 hours" },
        { value: 12, label: "12 hours" },
        { value: 24, label: "24 hours" },
        { value: 48, label: "48 hours" },
        { value: 168, label: "7 days" },
        { value: 336, label: "14 days" },
        { value: 672, label: "28 days" },
      ];
      const DB_SIZE_PERIOD_STORAGE_KEY = "uk_aq_db_size_period_hours";
      const DB_LINE_CHART_Y_MAX_MB = 500;
      const STORAGE_COVERAGE_MONTH_STORAGE_KEY = "uk_aq_storage_coverage_month";
      const DAY_MS = 24 * 60 * 60 * 1000;
      const COVERAGE_WEEKDAY_NAMES = [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday",
      ];
      let dispatchConnectorFilter = "all";
      let dispatchLookbackMinutes = 30;
      let dispatchCursor = null;
      let dbSizePeriodHours = 24;
      let storageCoverageMonthCursor = null;
      let latestDashboardData = null;

      try {
        const storedConnector = localStorage.getItem(DISPATCH_CONNECTOR_STORAGE_KEY);
        if (storedConnector && DISPATCH_CONNECTOR_OPTIONS.some((opt) => opt.value === storedConnector)) {
          dispatchConnectorFilter = storedConnector;
        }
        const storedLookback = Number(localStorage.getItem(DISPATCH_LOOKBACK_STORAGE_KEY));
        if (
          Number.isFinite(storedLookback) &&
          DISPATCH_LOOKBACK_OPTIONS.some((opt) => opt.value === storedLookback)
        ) {
          dispatchLookbackMinutes = storedLookback;
        }
        const storedCursor = localStorage.getItem(DISPATCH_CURSOR_STORAGE_KEY);
        if (storedCursor) {
          dispatchCursor = storedCursor;
        }
        const storedDbSizePeriod = Number(localStorage.getItem(DB_SIZE_PERIOD_STORAGE_KEY));
        if (
          Number.isFinite(storedDbSizePeriod) &&
          DB_SIZE_PERIOD_OPTIONS.some((opt) => opt.value === storedDbSizePeriod)
        ) {
          dbSizePeriodHours = storedDbSizePeriod;
        }
        const storedCoverageMonth = localStorage.getItem(STORAGE_COVERAGE_MONTH_STORAGE_KEY);
        const parsedCoverageMonth = parseCoverageMonthStorageKey(storedCoverageMonth);
        if (parsedCoverageMonth) {
          storageCoverageMonthCursor = parsedCoverageMonth;
        }
      } catch (_err) {
        // Ignore storage read issues and use defaults.
      }
      if (!storageCoverageMonthCursor) {
        storageCoverageMonthCursor = startOfUtcMonth(new Date());
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatTime(value) {
        if (!value) return "n/a";
        const date = new Date(value);
        return date.toLocaleString();
      }

      function formatDateTimeDdMmYyyyHhMmSs(value) {
        if (!value) return "n/a";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "n/a";
        const pad = (num) => String(num).padStart(2, "0");
        return `${pad(date.getDate())}/${pad(date.getMonth() + 1)}/${date.getFullYear()} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
      }

      function formatDateDdMmYyyy(value) {
        if (!value) return null;
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return null;
        const pad = (num) => String(num).padStart(2, "0");
        return `${pad(date.getDate())}/${pad(date.getMonth() + 1)}/${date.getFullYear()}`;
      }

      function parseUtcDayMs(value) {
        if (!value) return null;
        const raw = String(value).trim();
        const dayMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (dayMatch) {
          const year = Number(dayMatch[1]);
          const month = Number(dayMatch[2]) - 1;
          const day = Number(dayMatch[3]);
          return Date.UTC(year, month, day);
        }
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) return null;
        return Date.UTC(parsed.getUTCFullYear(), parsed.getUTCMonth(), parsed.getUTCDate());
      }

      function startOfUtcDay(date) {
        return new Date(Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth(),
          date.getUTCDate(),
          0,
          0,
          0,
          0,
        ));
      }

      function startOfUtcMonth(date) {
        return new Date(Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth(),
          1,
          0,
          0,
          0,
          0,
        ));
      }

      function addUtcDays(date, days) {
        return new Date(date.getTime() + days * DAY_MS);
      }

      function addUtcMonths(date, months) {
        return new Date(Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth() + months,
          1,
          0,
          0,
          0,
          0,
        ));
      }

      function toUtcDateKey(date) {
        const year = date.getUTCFullYear();
        const month = String(date.getUTCMonth() + 1).padStart(2, "0");
        const day = String(date.getUTCDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function parseUtcDateKey(dateKey) {
        const match = String(dateKey || "").trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return null;
        const year = Number(match[1]);
        const month = Number(match[2]) - 1;
        const day = Number(match[3]);
        return new Date(Date.UTC(year, month, day, 0, 0, 0, 0));
      }

      function formatCoverageMonthStorageKey(date) {
        const year = date.getUTCFullYear();
        const month = String(date.getUTCMonth() + 1).padStart(2, "0");
        return `${year}-${month}`;
      }

      function parseCoverageMonthStorageKey(value) {
        const match = String(value || "").trim().match(/^(\d{4})-(\d{2})$/);
        if (!match) return null;
        const year = Number(match[1]);
        const month = Number(match[2]) - 1;
        if (!Number.isFinite(year) || !Number.isFinite(month) || month < 0 || month > 11) {
          return null;
        }
        return new Date(Date.UTC(year, month, 1, 0, 0, 0, 0));
      }

      function sameUtcMonth(left, right) {
        return (
          left.getUTCFullYear() === right.getUTCFullYear() &&
          left.getUTCMonth() === right.getUTCMonth()
        );
      }

      function formatCoverageMonthTitle(monthStartUtc) {
        return monthStartUtc.toLocaleString(undefined, {
          month: "long",
          year: "numeric",
          timeZone: "UTC",
        });
      }

      function formatDbOldestDayLabel(value) {
        const formatted = formatDateDdMmYyyy(value);
        if (!formatted) {
          return ">=--/--/----";
        }
        return `>=${formatted}`;
      }

      function formatCount(value) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) {
          return "n/a";
        }
        return Number(value).toLocaleString();
      }

      function formatMegabytes(valueMb) {
        if (valueMb === null || valueMb === undefined || Number.isNaN(Number(valueMb))) {
          return "n/a";
        }
        const value = Number(valueMb);
        if (Math.abs(value) >= 100) {
          return Math.round(value).toLocaleString();
        }
        return value.toFixed(1);
      }

      function formatGigabytes(valueGb) {
        if (valueGb === null || valueGb === undefined || Number.isNaN(Number(valueGb))) {
          return "n/a";
        }
        return Number(valueGb).toFixed(2);
      }

      function formatBytesBestFit(valueBytes) {
        if (valueBytes === null || valueBytes === undefined || Number.isNaN(Number(valueBytes))) {
          return "n/a";
        }
        const value = Number(valueBytes);
        const abs = Math.abs(value);
        if (abs < 1000) {
          return `${Math.round(value)} bytes`;
        }
        const units = [
          { threshold: 1e12, label: "TB" },
          { threshold: 1e9, label: "GB" },
          { threshold: 1e6, label: "MB" },
          { threshold: 1e3, label: "kb" },
        ];
        for (const unit of units) {
          if (abs >= unit.threshold) {
            return `${(value / unit.threshold).toFixed(2)}${unit.label}`;
          }
        }
        return `${Math.round(value)} bytes`;
      }

      function asNumber(value) {
        if (value === null || value === undefined) return null;
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : null;
      }

      function asObject(value) {
        return value && typeof value === "object" && !Array.isArray(value) ? value : null;
      }

      function payloadNumber(payload, keys) {
        if (!payload) return null;
        for (const key of keys) {
          if (Object.prototype.hasOwnProperty.call(payload, key)) {
            const value = asNumber(payload[key]);
            if (value !== null) return value;
          }
        }
        return null;
      }

      function isNoStationRefsRun(run) {
        return (run && String(run.run_message || "").toLowerCase() === "no_station_refs");
      }

      function resolveStationCount(run) {
        if (isNoStationRefsRun(run)) {
          return 0;
        }
        const direct = asNumber(run && run.stations_updated);
        const payload = asObject(run && run.response_payload);
        const payloadStations = payloadNumber(payload, [
          "stations_polled",
          "stations_processed",
          "stations_selected",
          "stations_requested",
          "stations_updated",
          "stations",
        ]);
        if (direct !== null) {
          // Backward-compatible fallback: some historical rows stored 0 even when stations were polled.
          if (direct === 0 && payloadStations !== null && payloadStations > 0) {
            return payloadStations;
          }
          return direct;
        }
        return payloadStations;
      }

      function resolveGapStationsPolled(run) {
        const payload = asObject(run && run.response_payload);
        if (!payload) {
          return null;
        }
        return payloadNumber(payload, ["gap_stations_polled"]);
      }

      function resolveObservationCount(run) {
        const direct = asNumber(run && run.observations_upserted);
        if (direct !== null) {
          return direct;
        }
        const payload = asObject(run && run.response_payload);
        return payloadNumber(payload, [
          "observations_upserted",
          "observations",
        ]);
      }

      function partialRunDetail(run) {
        const rateLimitReasons = new Set([
          "remaining_low",
          "rate_limit_429",
          "rate_limit_guard",
        ]);
        const budgetReasons = new Set([
          "runtime_budget_exceeded",
          "max_requests_per_run",
          "request_budget_limited",
        ]);
        const payload = asObject(run && run.response_payload);
        const stoppedReason = String((payload && payload.stopped_reason) || "").toLowerCase();
        if (rateLimitReasons.has(stoppedReason)) {
          return "Rate-limit";
        }
        if (payload && payload.partial === true) {
          return "Budget Limit";
        }
        if (budgetReasons.has(stoppedReason)) {
          return "Budget Limit";
        }
        const message = String(run && run.run_message || "").toLowerCase();
        if (rateLimitReasons.has(message)) {
          return "Rate-limit";
        }
        if (budgetReasons.has(message)) {
          return "Budget Limit";
        }
        return null;
      }

      function statusMeta(run) {
        const partialDetail = partialRunDetail(run);
        if (partialDetail || String(run && run.run_status || "").toLowerCase() === "partial") {
          return { className: "partial", label: "Partial Run", detail: partialDetail || "Budget Limit" };
        }
        const raw = (run && run.run_status) || "unknown";
        return { className: String(raw).toLowerCase(), label: raw, detail: null };
      }

      function hasNoNewData(run) {
        if (String(run && run.run_status || "").toLowerCase() !== "succeeded") {
          return false;
        }
        if (isNoStationRefsRun(run)) {
          return false;
        }
        const stationCount = resolveStationCount(run);
        if (stationCount === null || stationCount <= 0) {
          return false;
        }
        const observations = resolveObservationCount(run);
        const series = asNumber(run && run.series_polled) ?? asNumber(run && run.timeseries_updated);
        if (observations === 0 && series === 0) {
          return true;
        }
        const connectorCode = String(run && run.connector_code || "").toLowerCase();
        if (connectorCode === "breathelondon" && observations === null && series === 0) {
          return true;
        }
        return false;
      }

      function formatStations(run) {
        const stationCount = resolveStationCount(run);
        const gapStationsPolled = resolveGapStationsPolled(run);
        if (stationCount !== null) {
          const base = formatCount(stationCount);
          if (gapStationsPolled !== null && gapStationsPolled > 0) {
            return `${base}<br><span class="metric-note">(${formatCount(gapStationsPolled)} GAP)</span>`;
          }
          return base;
        }
        if (run.series_polled !== null && run.series_polled !== undefined) {
          return `${formatCount(run.series_polled)} series`;
        }
        return "n/a";
      }

      function formatObservations(run) {
        if (hasNoNewData(run)) {
          return `<span class="metric-note">No new data</span>`;
        }
        const observations = resolveObservationCount(run);
        return formatCount(observations);
      }

      function formatSeries(run) {
        if (run.series_polled !== null && run.series_polled !== undefined) {
          return formatCount(run.series_polled);
        }
        if (run.timeseries_updated !== null && run.timeseries_updated !== undefined) {
          return formatCount(run.timeseries_updated);
        }
        return "n/a";
      }

      function formatMinutes(value) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) {
          return null;
        }
        return `${Number(value)}m`;
      }

      function formatDurationSeconds(totalSeconds) {
        if (totalSeconds === null || totalSeconds === undefined || Number.isNaN(Number(totalSeconds))) {
          return null;
        }
        const rounded = Math.max(0, Math.round(Number(totalSeconds)));
        const minutes = Math.floor(rounded / 60);
        const seconds = rounded % 60;
        return `${minutes}m ${seconds}s`;
      }

      function calcDurationMinutes(run) {
        const startRaw = run.run_started_at;
        const endRaw = run.run_ended_at;
        if (startRaw && endRaw) {
          const start = new Date(startRaw).getTime();
          const end = new Date(endRaw).getTime();
          if (!Number.isNaN(start) && !Number.isNaN(end) && end >= start) {
            return (end - start) / 60000;
          }
        }
        if (run.in_flight_minutes !== null && run.in_flight_minutes !== undefined) {
          return Number(run.in_flight_minutes);
        }
        return null;
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function setDataMeta(payload) {
        const projectRef = payload && payload.project_ref ? payload.project_ref : "n/a";
        dataMetaEl.textContent = `Project ${projectRef}`;
      }

      function setError(text) {
        errorEl.textContent = text || "";
      }

      function clearRefreshTimer() {
        if (refreshTimer) {
          clearInterval(refreshTimer);
          refreshTimer = null;
        }
      }

      function isPageActive() {
        return !document.hidden && document.hasFocus();
      }

      function startRefreshTimer() {
        clearRefreshTimer();
        if (!isPageActive()) {
          return;
        }
        refreshTimer = setInterval(() => {
          if (!isPageActive()) {
            return;
          }
          loadDashboard();
        }, refreshSeconds * 1000);
      }

      function setRefreshInterval(seconds) {
        refreshSeconds = seconds;
        startRefreshTimer();
      }

      function handleActivityChange() {
        if (!isPageActive()) {
          clearRefreshTimer();
          wasInactive = true;
          return;
        }
        startRefreshTimer();
        if (wasInactive) {
          loadDashboard();
          wasInactive = false;
        }
      }

      function renderPanel(pollutant) {
        const panel = document.createElement("section");
        panel.className = "panel";
        panel.innerHTML = `
          <h2>${pollutant.label} <span class="chip">${pollutant.key}</span></h2>
          <table>
            <thead>
              <tr>
                <th>Connector</th>
                <th>Stations</th>
                <th>Active</th>
                <th>0-3</th>
                <th>3-6</th>
                <th>6-24</th>
                <th>1-7</th>
                <th>7+</th>
                <th>Trend</th>
              </tr>
            </thead>
            <tbody>
              ${pollutant.connectors
                .map((row) => {
                  const total = row.stations_with_pollutant || 0;
                  const active = row.active_stations_with_pollutant || 0;
                  const bucketCounts = bucketOrder.map((bucket) => row.buckets[bucket] || 0);
                  const segments = bucketCounts
                    .map((count, idx) => {
                      const pct = total ? (count / total) * 100 : 0;
                      const label = `${bucketOrder[idx]}: ${count}`;
                      return `<span class="seg seg-${idx}" style="width:${pct}%" title="${label}"></span>`;
                    })
                    .join("");
                  return `
                    <tr>
                      <td class="connector-name">${row.label}</td>
                      <td>${total}</td>
                      <td>${active}</td>
                      <td>${bucketCounts[0]}</td>
                      <td>${bucketCounts[1]}</td>
                      <td>${bucketCounts[2]}</td>
                      <td>${bucketCounts[3]}</td>
                      <td>${bucketCounts[4]}</td>
                      <td><div class="bucket-bar">${segments}</div></td>
                    </tr>
                  `;
                })
                .join("")}
            </tbody>
          </table>
          <div class="footnote">Buckets are based on timeseries last_value_at timestamps.</div>
        `;
        return panel;
      }

      function renderDispatchPanel(runs) {
        const filteredRuns = (Array.isArray(runs) ? runs : []).filter((run) => {
          const connectorCode = String((run && run.connector_code) || "").toLowerCase();
          if (dispatchConnectorFilter !== "all" && connectorCode !== dispatchConnectorFilter) {
            return false;
          }
          if (dispatchLookbackMinutes <= 0) {
            return true;
          }
          const timestamp = run.run_timestamp || run.run_ended_at || run.run_started_at;
          if (!timestamp) {
            return false;
          }
          const runMs = new Date(timestamp).getTime();
          if (Number.isNaN(runMs)) {
            return false;
          }
          const cutoffMs = Date.now() - dispatchLookbackMinutes * 60 * 1000;
          return runMs >= cutoffMs;
        });

        const panel = document.createElement("section");
        panel.className = "panel";
        panel.innerHTML = `
          <h2 class="panel-heading">
            <span>Dispatcher Feed</span>
            <div class="dispatch-filters">
              <label class="dispatch-filter" for="dispatch-connector-filter">
                Connector
                <select id="dispatch-connector-filter">
                  ${DISPATCH_CONNECTOR_OPTIONS
                    .map((opt) => `<option value="${opt.value}" ${opt.value === dispatchConnectorFilter ? "selected" : ""}>${opt.label}</option>`)
                    .join("")}
                </select>
              </label>
              <label class="dispatch-filter" for="dispatch-lookback-filter">
                Lookback
                <select id="dispatch-lookback-filter">
                  ${DISPATCH_LOOKBACK_OPTIONS
                    .map((opt) => `<option value="${opt.value}" ${opt.value === dispatchLookbackMinutes ? "selected" : ""}>${opt.label}</option>`)
                    .join("")}
                </select>
              </label>
            </div>
          </h2>
          <table class="dispatch-table">
            <thead>
              <tr>
                <th>Connector</th>
                <th>Status</th>
                <th>Duration</th>
                <th>Updated</th>
                <th>Last observed</th>
                <th>Stations</th>
                <th>Observations</th>
                <th>Series</th>
              </tr>
            </thead>
            <tbody>
              ${filteredRuns.length
                ? filteredRuns
                .map((run) => {
                  const status = statusMeta(run);
                  const timestamp = run.run_timestamp || run.run_ended_at || run.run_started_at;
                  const minutes = formatMinutes(run.in_flight_minutes);
                  const durationMinutes = calcDurationMinutes(run);
                  const duration = durationMinutes === null ? null : formatDurationSeconds(durationMinutes * 60);
                  const runtimeBadge = minutes
                    ? `<span class="runtime-pill ${
                        Number(run.in_flight_minutes) >= 5 ? "overdue" : ""
                      }">${minutes}</span>`
                    : "";
                  return `
                    <tr>
                      <td class="connector-name">${run.connector_label || run.connector_code || "Unknown"}</td>
                      <td>
                        <div class="status-stack">
                          <span class="status-pill ${status.className}">${status.label}${status.detail ? `<br><span class="status-detail">${status.detail}</span>` : ""}</span>
                          ${runtimeBadge}
                        </div>
                      </td>
                      <td>${duration || "n/a"}</td>
                      <td>${formatTime(timestamp)}</td>
                      <td>${formatTime(run.last_observed_at)}</td>
                      <td>${formatStations(run)}</td>
                      <td>${formatObservations(run)}</td>
                      <td>${formatSeries(run)}</td>
                    </tr>
                  `;
                })
                .join("")
                : `<tr><td colspan="8">No runs found for selected filters.</td></tr>`}
            </tbody>
          </table>
          <div class="footnote">Ordered by most recent run end time. Filters persist across refresh.</div>
        `;

        const connectorSelect = panel.querySelector("#dispatch-connector-filter");
        if (connectorSelect) {
          connectorSelect.addEventListener("change", (event) => {
            const nextValue = String(event.target.value || "all");
            if (!DISPATCH_CONNECTOR_OPTIONS.some((opt) => opt.value === nextValue)) {
              return;
            }
            dispatchConnectorFilter = nextValue;
            try {
              localStorage.setItem(DISPATCH_CONNECTOR_STORAGE_KEY, dispatchConnectorFilter);
            } catch (_err) {
              // Ignore storage write issues.
            }
            loadDashboard();
          });
        }
        const lookbackSelect = panel.querySelector("#dispatch-lookback-filter");
        if (lookbackSelect) {
          lookbackSelect.addEventListener("change", (event) => {
            const nextMinutes = Number(event.target.value);
            if (
              !Number.isFinite(nextMinutes) ||
              !DISPATCH_LOOKBACK_OPTIONS.some((opt) => opt.value === nextMinutes)
            ) {
              return;
            }
            dispatchLookbackMinutes = nextMinutes;
            try {
              localStorage.setItem(DISPATCH_LOOKBACK_STORAGE_KEY, String(dispatchLookbackMinutes));
            } catch (_err) {
              // Ignore storage write issues.
            }
            loadDashboard();
          });
        }

        return panel;
      }

      function buildDbPath(points, key, xFor, yFor) {
        let path = "";
        let started = false;
        points.forEach((point) => {
          const value = point[key];
          if (value === null || value === undefined || Number.isNaN(Number(value))) {
            return;
          }
          const command = started ? "L" : "M";
          path += `${command}${xFor(point.ms).toFixed(2)},${yFor(Number(value)).toFixed(2)} `;
          started = true;
        });
        return path.trim();
      }

      function getSingleSeriesPoint(points, key) {
        const valid = points.filter((point) => {
          const value = point[key];
          return value !== null && value !== undefined && !Number.isNaN(Number(value));
        });
        return valid.length === 1 ? valid[0] : null;
      }

      function computeAxisMax(value) {
        const numeric = Number(value);
        if (!Number.isFinite(numeric) || numeric <= 0) {
          return 1;
        }
        const magnitude = 10 ** Math.floor(Math.log10(numeric));
        const normalized = numeric / magnitude;
        let step = 1;
        if (normalized > 8) {
          step = 10;
        } else if (normalized > 4) {
          step = 5;
        } else if (normalized > 2) {
          step = 2.5;
        } else if (normalized > 1.2) {
          step = 2;
        }
        return Math.max(1, step * magnitude);
      }

      function buildYAxisTicks(axisMax, tickCount = 5) {
        const ticks = [];
        const maxValue = Math.max(1, Number(axisMax) || 1);
        for (let idx = 0; idx <= tickCount; idx += 1) {
          ticks.push((maxValue / tickCount) * idx);
        }
        return ticks;
      }

      function buildStackedAreaPath(points, key, priorKeys, xFor, yFor) {
        if (!Array.isArray(points) || points.length === 0) {
          return "";
        }
        const topPoints = points.map((point) => {
          const priorSum = priorKeys.reduce((sum, priorKey) => sum + Number(point[priorKey] || 0), 0);
          const value = Number(point[key] || 0);
          return {
            x: xFor(point.ms),
            top: yFor(priorSum + value),
            bottom: yFor(priorSum),
          };
        });
        const hasVisible = topPoints.some((point) => Math.abs(point.top - point.bottom) > 0.1);
        if (!hasVisible) {
          return "";
        }
        const upper = topPoints
          .map((point, index) => `${index === 0 ? "M" : "L"}${point.x.toFixed(2)},${point.top.toFixed(2)}`)
          .join(" ");
        const lower = [...topPoints]
          .reverse()
          .map((point) => `L${point.x.toFixed(2)},${point.bottom.toFixed(2)}`)
          .join(" ");
        return `${upper} ${lower} Z`;
      }

      function buildStackedMetricPoints(rows, dimensionKey, allowedKeys, cutoffMs) {
        const allowed = new Set(allowedKeys);
        const pointMap = new Map();
        (Array.isArray(rows) ? rows : []).forEach((row) => {
          const key = String((row && row[dimensionKey]) || "").toLowerCase().trim();
          if (!allowed.has(key)) {
            return;
          }
          const timestamp = (row && (row.bucket_hour || row.recorded_at)) || null;
          const ms = new Date(timestamp || "").getTime();
          if (Number.isNaN(ms) || ms < cutoffMs) {
            return;
          }
          const sizeBytes = asNumber(row && row.size_bytes);
          if (sizeBytes === null || sizeBytes < 0) {
            return;
          }
          const bucketKey = String(ms);
          const point = pointMap.get(bucketKey) || { ms };
          allowedKeys.forEach((seriesKey) => {
            if (point[seriesKey] === undefined) {
              point[seriesKey] = 0;
            }
          });
          point[key] = sizeBytes / (1024 * 1024);
          pointMap.set(bucketKey, point);
        });
        return Array.from(pointMap.values())
          .sort((a, b) => a.ms - b.ms)
          .map((point) => {
            const normalized = { ms: point.ms };
            allowedKeys.forEach((seriesKey) => {
              const value = asNumber(point[seriesKey]);
              normalized[seriesKey] = value === null ? 0 : Math.max(0, value);
            });
            return normalized;
          });
      }

      function buildDbTooltipTargets(points, key, label, color, xFor, yFor) {
        return points
          .map((point) => {
            const value = point[key];
            if (value === null || value === undefined || Number.isNaN(Number(value))) {
              return "";
            }
            const bucketLabel = new Date(point.ms).toLocaleString();
            const sizeLabel = `${formatMegabytes(Number(value))} MB`;
            const oldestKey = `${key}_oldest_observed_at`;
            const oldestDayLabel = formatDbOldestDayLabel(point[oldestKey] || null);
            return `
              <circle
                class="db-size-tooltip-hit"
                cx="${xFor(point.ms).toFixed(2)}"
                cy="${yFor(Number(value)).toFixed(2)}"
                r="7"
                fill="${color}"
                fill-opacity="0.001"
                stroke="none"
                pointer-events="all"
                data-label="${escapeHtml(label)}"
                data-bucket="${escapeHtml(bucketLabel)}"
                data-size="${escapeHtml(sizeLabel)}"
                data-oldest-day="${escapeHtml(oldestDayLabel)}"
              />
            `;
          })
          .join("");
      }

      function bindDbSizeTooltips(panel) {
        const chartWrap = panel.querySelector(".db-size-chart-wrap");
        const tooltip = panel.querySelector(".db-size-hover-tooltip");
        const targets = panel.querySelectorAll(".db-size-tooltip-hit");
        if (!chartWrap || !tooltip || targets.length === 0) {
          return;
        }

        function positionTooltip(clientX, clientY) {
          const wrapRect = chartWrap.getBoundingClientRect();
          const localY = clientY - wrapRect.top;
          const halfWidth = Math.max(30, tooltip.offsetWidth / 2 + 8);
          const x = Math.max(halfWidth, Math.min(wrapRect.width - halfWidth, clientX - wrapRect.left));
          const tooltipHeight = Math.max(20, tooltip.offsetHeight);
          const y = Math.max(8, Math.min(wrapRect.height - tooltipHeight - 8, localY + 10));
          tooltip.style.left = `${x}px`;
          tooltip.style.top = `${y}px`;
        }

        function showTooltip(event) {
          const target = event.currentTarget;
          const label = target.getAttribute("data-label") || "";
          const bucket = target.getAttribute("data-bucket") || "";
          const size = target.getAttribute("data-size") || "";
          const oldestDay = target.getAttribute("data-oldest-day") || ">=--/--/----";
          tooltip.innerHTML = `
            <div>${escapeHtml(label)}</div>
            <div>Bucket: ${escapeHtml(bucket)}</div>
            <div>Cluster size: ${escapeHtml(size)}</div>
            <div>Oldest day: ${escapeHtml(oldestDay)}</div>
          `;
          tooltip.classList.add("visible");
          positionTooltip(event.clientX, event.clientY);
        }

        function moveTooltip(event) {
          if (!tooltip.classList.contains("visible")) {
            return;
          }
          positionTooltip(event.clientX, event.clientY);
        }

        function hideTooltip() {
          tooltip.classList.remove("visible");
        }

        targets.forEach((target) => {
          target.addEventListener("mouseenter", showTooltip);
          target.addEventListener("mousemove", moveTooltip);
          target.addEventListener("mouseleave", hideTooltip);
        });
        chartWrap.addEventListener("mouseleave", hideTooltip);
      }

      async function refreshR2MetricsOnly() {
        if (!latestDashboardData) {
          return;
        }
        setError("");
        setStatus("Refreshing R2 metrics...");
        try {
          const params = new URLSearchParams();
          params.set("force", "1");
          params.set("t", String(Date.now()));
          const resp = await fetch(`/api/r2_metrics?${params.toString()}`);
          const text = await resp.text();
          let payload = null;
          try {
            payload = JSON.parse(text);
          } catch (_err) {
            payload = null;
          }
          if (!resp.ok) {
            const message =
              (payload && (payload.error || payload.message)) ||
              text ||
              `Request failed (${resp.status})`;
            throw new Error(message);
          }
          latestDashboardData.r2_usage = payload ? payload.r2_usage : null;
          latestDashboardData.r2_usage_error = payload ? payload.r2_usage_error : null;
          latestDashboardData.r2_backup_window = payload ? payload.r2_backup_window : null;
          latestDashboardData.r2_backup_window_error = payload ? payload.r2_backup_window_error : null;
          const nextPanel = renderDbSizePanel(
            latestDashboardData.db_size_metrics,
            latestDashboardData.db_size_metrics_error,
            latestDashboardData.schema_size_metrics,
            latestDashboardData.schema_size_metrics_error,
            latestDashboardData.r2_domain_size_metrics,
            latestDashboardData.r2_domain_size_metrics_error,
            latestDashboardData.r2_usage,
            latestDashboardData.r2_usage_error,
            latestDashboardData.r2_backup_window,
            latestDashboardData.r2_backup_window_error,
          );
          const currentPanel = dashboardEl.querySelector('[data-panel="db-size"]');
          if (currentPanel) {
            currentPanel.replaceWith(nextPanel);
          } else {
            dashboardEl.appendChild(nextPanel);
          }
          const generatedAt = (payload && payload.generated_at) || new Date().toISOString();
          setStatus(`R2 metrics refreshed ${formatTime(generatedAt)} (local time)`);
        } catch (err) {
          setError(err.message || String(err));
          setStatus("Error");
        }
      }

      function renderDbSizePanel(
        dbRows,
        dbSourceError,
        schemaRows,
        schemaSourceError,
        r2DomainRows,
        r2DomainSourceError,
        r2Usage,
        r2Error,
        r2BackupWindow,
        r2BackupWindowError,
      ) {
        const panel = document.createElement("section");
        panel.className = "panel";
        panel.dataset.panel = "db-size";

        const cutoffMs = Date.now() - dbSizePeriodHours * 60 * 60 * 1000;
        const pointMap = new Map();
        const oldestByLabel = new Map();
        (Array.isArray(dbRows) ? dbRows : []).forEach((row) => {
          let label = String((row && row.database_label) || "").toLowerCase().trim();
          if (label === "obs_aqidb") {
            label = "obs_aqidb";
          }
          if (label !== "ingestdb" && label !== "obs_aqidb") {
            return;
          }
          const sampleTimestamp = row.recorded_at || row.bucket_hour;
          const sampleMs = new Date(sampleTimestamp).getTime();
          const oldestObservedAt = row.oldest_observed_at;
          const oldestMs = new Date(oldestObservedAt || "").getTime();
          if (!Number.isNaN(sampleMs) && !Number.isNaN(oldestMs)) {
            const currentOldest = oldestByLabel.get(label);
            if (!currentOldest || sampleMs >= currentOldest.sampleMs) {
              oldestByLabel.set(label, {
                sampleMs,
                oldestObservedAt,
              });
            }
          }
          const timestamp = row.bucket_hour || row.recorded_at;
          const ms = new Date(timestamp).getTime();
          if (Number.isNaN(ms) || ms < cutoffMs) {
            return;
          }
          const sizeBytes = asNumber(row.size_bytes);
          if (sizeBytes === null || sizeBytes < 0) {
            return;
          }
          const key = String(ms);
          const point = pointMap.get(key) || { ms, ingestdb: null, obs_aqidb: null };
          point[label] = sizeBytes / (1024 * 1024);
          point[`${label}_oldest_observed_at`] = oldestObservedAt || null;
          pointMap.set(key, point);
        });

        const schemaOldestByName = new Map();
        (Array.isArray(schemaRows) ? schemaRows : []).forEach((row) => {
          const schemaName = String((row && row.schema_name) || "").toLowerCase();
          if (schemaName !== "uk_aq_observs" && schemaName !== "uk_aq_aqilevels") {
            return;
          }
          const sampleTimestamp = (row && (row.recorded_at || row.bucket_hour)) || null;
          const sampleMs = new Date(sampleTimestamp || "").getTime();
          const oldestObservedAt = row && row.oldest_observed_at;
          const oldestMs = new Date(oldestObservedAt || "").getTime();
          if (Number.isNaN(sampleMs) || Number.isNaN(oldestMs)) {
            return;
          }
          const current = schemaOldestByName.get(schemaName);
          if (!current || sampleMs >= current.sampleMs) {
            schemaOldestByName.set(schemaName, {
              sampleMs,
              oldestObservedAt,
            });
          }
        });
        const observsOldestDayLabel = formatDbOldestDayLabel(
          (schemaOldestByName.get("uk_aq_observs") || {}).oldestObservedAt,
        );
        const aqilevelsOldestDayLabel = formatDbOldestDayLabel(
          (schemaOldestByName.get("uk_aq_aqilevels") || {}).oldestObservedAt,
        );
        const ingestOldestDayLabel = formatDbOldestDayLabel(
          (oldestByLabel.get("ingestdb") || {}).oldestObservedAt,
        );

        const points = Array.from(pointMap.values()).sort((a, b) => a.ms - b.ms);
        const maxObservedMb = points.reduce((max, point) => {
          const ingest = point.ingestdb === null ? 0 : Number(point.ingestdb);
          const obsAqi = point.obs_aqidb === null ? 0 : Number(point.obs_aqidb);
          return Math.max(max, ingest, obsAqi);
        }, 0);
        const yAxisMaxMb = DB_LINE_CHART_Y_MAX_MB;

        let chartMarkup = `<div class="db-size-empty">No DB cluster size samples in the selected period.</div>`;
        if (points.length > 0) {
          const width = 960;
          const height = 300;
          const margin = { top: 16, right: 18, bottom: 36, left: 56 };
          const innerWidth = width - margin.left - margin.right;
          const innerHeight = height - margin.top - margin.bottom;

          const minX = points[0].ms;
          const maxX = points[points.length - 1].ms;
          const spanX = Math.max(1, maxX - minX);
          const xFor = (ms) => margin.left + ((ms - minX) / spanX) * innerWidth;
          const yFor = (valueMb) => {
            const capped = Math.max(0, Math.min(yAxisMaxMb, Number(valueMb)));
            return margin.top + (1 - capped / yAxisMaxMb) * innerHeight;
          };

          const yTicks = buildYAxisTicks(yAxisMaxMb, 5);
          const xTicks = [minX, minX + spanX / 2, maxX];

          const ingestPath = buildDbPath(points, "ingestdb", xFor, yFor);
          const obsAqiPath = buildDbPath(points, "obs_aqidb", xFor, yFor);
          const ingestSinglePoint = getSingleSeriesPoint(points, "ingestdb");
          const obsAqiSinglePoint = getSingleSeriesPoint(points, "obs_aqidb");
          const ingestTooltipTargets = buildDbTooltipTargets(
            points,
            "ingestdb",
            "Ingest DB cluster",
            "#ff2d2d",
            xFor,
            yFor,
          );
          const obsAqiTooltipTargets = buildDbTooltipTargets(
            points,
            "obs_aqidb",
            "Observs & AQI DB Cluster",
            "#3b82f6",
            xFor,
            yFor,
          );

          chartMarkup = `
            <svg class="db-size-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="Ingest and Observs/AQI DB cluster size trend">
              ${yTicks
                .map((tick) => {
                  const y = yFor(tick);
                  return `
                    <line x1="${margin.left}" y1="${y}" x2="${width - margin.right}" y2="${y}" stroke="#e7dbc7" stroke-width="1" />
                    <text x="${margin.left - 8}" y="${y + 4}" text-anchor="end" fill="#6b6255" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">${formatMegabytes(tick)}</text>
                  `;
                })
                .join("")}
              <line x1="${margin.left}" y1="${height - margin.bottom}" x2="${width - margin.right}" y2="${height - margin.bottom}" stroke="#bfae91" stroke-width="1.3" />
              ${xTicks
                .map((tick, idx) => {
                  const x = xFor(tick);
                  const anchor = idx === 0 ? "start" : idx === xTicks.length - 1 ? "end" : "middle";
                  return `
                    <line x1="${x}" y1="${height - margin.bottom}" x2="${x}" y2="${height - margin.bottom + 5}" stroke="#bfae91" stroke-width="1" />
                    <text x="${x}" y="${height - margin.bottom + 20}" text-anchor="${anchor}" fill="#6b6255" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">${new Date(tick).toLocaleString()}</text>
                  `;
                })
                .join("")}
              ${ingestPath ? `<path d="${ingestPath}" fill="none" stroke="#ff2d2d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />` : ""}
              ${obsAqiPath ? `<path d="${obsAqiPath}" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />` : ""}
              ${ingestTooltipTargets}
              ${obsAqiTooltipTargets}
              ${ingestSinglePoint ? `<circle cx="${xFor(ingestSinglePoint.ms).toFixed(2)}" cy="${yFor(Number(ingestSinglePoint.ingestdb)).toFixed(2)}" r="3.5" fill="#ff2d2d" />` : ""}
              ${obsAqiSinglePoint ? `<circle cx="${xFor(obsAqiSinglePoint.ms).toFixed(2)}" cy="${yFor(Number(obsAqiSinglePoint.obs_aqidb)).toFixed(2)}" r="3.5" fill="#3b82f6" />` : ""}
            </svg>
          `;
        }

        const maxNote = maxObservedMb > yAxisMaxMb
          ? `Line chart fixed at ${formatMegabytes(yAxisMaxMb)} MB (max observed ${formatMegabytes(maxObservedMb)} MB).`
          : `Line chart fixed at ${formatMegabytes(yAxisMaxMb)} MB.`;

        const renderStackedChart = ({ title, points, seriesDefs, ariaLabel, emptyLabel }) => {
          if (!Array.isArray(points) || points.length === 0) {
            return `
              <div class="db-size-subchart">
                <h3>${escapeHtml(title)}</h3>
                <div class="db-size-chart-wrap">
                  <div class="db-size-empty">${escapeHtml(emptyLabel)}</div>
                </div>
              </div>
            `;
          }

          const width = 960;
          const height = 260;
          const margin = { top: 16, right: 18, bottom: 36, left: 56 };
          const innerWidth = width - margin.left - margin.right;
          const innerHeight = height - margin.top - margin.bottom;
          const minX = points[0].ms;
          const maxX = points[points.length - 1].ms;
          const spanX = Math.max(1, maxX - minX);
          const xFor = (ms) => margin.left + ((ms - minX) / spanX) * innerWidth;
          const maxStack = points.reduce((max, point) => {
            const total = seriesDefs.reduce((sum, series) => sum + Number(point[series.key] || 0), 0);
            return Math.max(max, total);
          }, 0);
          const yMax = computeAxisMax(maxStack);
          const yFor = (valueMb) => {
            const capped = Math.max(0, Math.min(yMax, Number(valueMb)));
            return margin.top + (1 - capped / yMax) * innerHeight;
          };
          const yTicks = buildYAxisTicks(yMax, 5);
          const xTicks = [minX, minX + spanX / 2, maxX];

          const paths = seriesDefs
            .map((series, index) => {
              const priorKeys = seriesDefs.slice(0, index).map((entry) => entry.key);
              const path = buildStackedAreaPath(points, series.key, priorKeys, xFor, yFor);
              if (!path) {
                return "";
              }
              return `<path d="${path}" fill="${series.color}" fill-opacity="0.68" stroke="${series.color}" stroke-width="1.1" />`;
            })
            .join("");

          return `
            <div class="db-size-subchart">
              <h3>${escapeHtml(title)}</h3>
              <div class="db-size-chart-wrap">
                <svg class="db-size-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="${escapeHtml(ariaLabel)}">
                  ${yTicks
                    .map((tick) => {
                      const y = yFor(tick);
                      return `
                        <line x1="${margin.left}" y1="${y}" x2="${width - margin.right}" y2="${y}" stroke="#e7dbc7" stroke-width="1" />
                        <text x="${margin.left - 8}" y="${y + 4}" text-anchor="end" fill="#6b6255" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">${formatMegabytes(tick)}</text>
                      `;
                    })
                    .join("")}
                  <line x1="${margin.left}" y1="${height - margin.bottom}" x2="${width - margin.right}" y2="${height - margin.bottom}" stroke="#bfae91" stroke-width="1.3" />
                  ${xTicks
                    .map((tick, idx) => {
                      const x = xFor(tick);
                      const anchor = idx === 0 ? "start" : idx === xTicks.length - 1 ? "end" : "middle";
                      return `
                        <line x1="${x}" y1="${height - margin.bottom}" x2="${x}" y2="${height - margin.bottom + 5}" stroke="#bfae91" stroke-width="1" />
                        <text x="${x}" y="${height - margin.bottom + 20}" text-anchor="${anchor}" fill="#6b6255" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">${new Date(tick).toLocaleString()}</text>
                      `;
                    })
                    .join("")}
                  ${paths}
                </svg>
              </div>
              <div class="db-size-sublegend">
                ${seriesDefs
                  .map((series) => `<span class="db-size-item-title"><span class="db-size-swatch" style="background:${series.color}"></span>${escapeHtml(series.label)}</span>`)
                  .join("")}
              </div>
            </div>
          `;
        };

        const schemaPoints = buildStackedMetricPoints(
          schemaRows,
          "schema_name",
          ["uk_aq_observs", "uk_aq_aqilevels"],
          cutoffMs,
        );
        const schemaChartMarkup = renderStackedChart({
          title: "obs_aqidb schema sizes (MB)",
          points: schemaPoints,
          ariaLabel: "obs_aqidb schema size stacked area chart",
          emptyLabel: "No schema size samples in the selected period.",
          seriesDefs: [
            { key: "uk_aq_observs", label: "uk_aq_observs", color: "#ff7f50" },
            { key: "uk_aq_aqilevels", label: "uk_aq_aqilevels", color: "#3b82f6" },
          ],
        });

        const r2DomainPoints = buildStackedMetricPoints(
          r2DomainRows,
          "domain_name",
          ["observations", "aqilevels"],
          cutoffMs,
        );
        const r2DomainChartMarkup = renderStackedChart({
          title: "R2 History domain sizes (MB)",
          points: r2DomainPoints,
          ariaLabel: "R2 history domain size stacked area chart",
          emptyLabel: "No R2 domain size samples in the selected period.",
          seriesDefs: [
            { key: "observations", label: "observations", color: "#f59e0b" },
            { key: "aqilevels", label: "aqilevels", color: "#16a34a" },
          ],
        });

        const r2UsageObject = asObject(r2Usage);
        const r2BackupWindowObject = asObject(r2BackupWindow);
        const backupWindowMin = formatDateDdMmYyyy(
          r2BackupWindowObject ? r2BackupWindowObject.min_day_utc : null,
        ) || "--/--/----";
        const backupWindowMax = formatDateDdMmYyyy(
          r2BackupWindowObject ? r2BackupWindowObject.max_day_utc : null,
        ) || "--/--/----";
        const backupWindowMinDayMs = parseUtcDayMs(
          r2BackupWindowObject ? r2BackupWindowObject.min_day_utc : null,
        );
        const backupWindowMaxDayMs = parseUtcDayMs(
          r2BackupWindowObject ? r2BackupWindowObject.max_day_utc : null,
        );
        let backupWindowDays = null;
        let backupWindowYears = null;
        if (
          backupWindowMinDayMs !== null &&
          backupWindowMaxDayMs !== null &&
          backupWindowMaxDayMs >= backupWindowMinDayMs
        ) {
          backupWindowDays = Math.floor(
            (backupWindowMaxDayMs - backupWindowMinDayMs) / (24 * 60 * 60 * 1000),
          ) + 1;
          backupWindowYears = backupWindowDays / 365.25;
        }
        const backupWindowLabel = `CLOUDFLARE R2 BACKUP WINDOW - ${backupWindowMin} -> ${backupWindowMax} - ${backupWindowDays !== null ? backupWindowDays : "n/a"} Days - ${backupWindowYears !== null ? backupWindowYears.toFixed(1) : "n/a"} Years`;
        const getNextR2LimitsResetDate = () => {
          const now = new Date();
          let target = new Date(now.getFullYear(), now.getMonth(), 24);
          if (now.getDate() >= 24) {
            target = new Date(now.getFullYear(), now.getMonth() + 1, 24);
          }
          const day = String(target.getDate()).padStart(2, "0");
          const month = String(target.getMonth() + 1).padStart(2, "0");
          const year = String(target.getFullYear());
          return `${day}/${month}/${year}`;
        };
        const r2LimitsResetLabel = `Limits reset: ${getNextR2LimitsResetDate()}`;
        const r2Rows = [];
        let r2LastUpdate = "n/a";
        const addUsageRow = (title, summaryText, percentValue, subText, subRightText) => {
          const fillPct = Math.min(100, Math.max(0, Number(percentValue)));
          let subMarkup = "";
          if (subText || subRightText) {
            if (subRightText) {
              subMarkup = `
                <div class="r2-usage-sub r2-usage-sub-split">
                  <span>${escapeHtml(subText || "")}</span>
                  <span class="r2-usage-sub-right">${escapeHtml(String(subRightText))}</span>
                </div>
              `;
            } else {
              subMarkup = `<div class="r2-usage-sub">${escapeHtml(subText || "")}</div>`;
            }
          }
          r2Rows.push(`
            <div class="r2-usage-row">
              <div class="r2-usage-head">
                <span>${escapeHtml(title)}</span>
                <span>${escapeHtml(summaryText)}</span>
              </div>
              <div class="r2-usage-bar" role="img" aria-label="${escapeHtml(title)} usage">
                <div class="r2-usage-fill" style="width:${fillPct.toFixed(2)}%"></div>
              </div>
              ${subMarkup}
            </div>
          `);
        };
        const addUnavailableRow = (title, errorText) => {
          const suffix = errorText ? `: ${String(errorText)}` : "";
          r2Rows.push(`
            <div class="r2-usage-row">
              <div class="r2-usage-sub">${escapeHtml(`${title} unavailable${suffix}`)}</div>
            </div>
          `);
        };
        if (r2UsageObject) {
          r2LastUpdate = formatDateTimeDdMmYyyyHhMmSs(r2UsageObject.as_of_utc);

          const usedGb = asNumber(r2UsageObject.standard_used_gb);
          const usedBytes = asNumber(r2UsageObject.standard_used_bytes);
          const freeTierGb = asNumber(r2UsageObject.free_tier_gb);
          const storagePercent = asNumber(r2UsageObject.percent_of_free_tier);
          const objects = asNumber(r2UsageObject.standard_objects);
          if (usedGb !== null && freeTierGb !== null && storagePercent !== null) {
            addUsageRow(
              "R2 Standard free tier (storage)",
              `${formatGigabytes(usedGb)} GB / ${formatGigabytes(freeTierGb)} GB (${Math.round(storagePercent)}%)`,
              storagePercent,
              objects !== null ? `Objects: ${formatCount(objects)}` : "",
              usedBytes !== null ? `Size: ${formatBytesBestFit(usedBytes)}` : "",
            );
          } else {
            addUnavailableRow("R2 Standard free tier (storage)", r2Error);
          }

          const classAUsed = asNumber(r2UsageObject.class_a_used_requests);
          const classAFree = asNumber(r2UsageObject.class_a_free_tier_requests);
          const classAPercent = asNumber(r2UsageObject.class_a_percent_of_free_tier);
          if (classAUsed !== null && classAFree !== null && classAPercent !== null) {
            addUsageRow(
              "R2 Class A free tier",
              `${formatCount(classAUsed)} / ${formatCount(classAFree)} (${Math.round(classAPercent)}%)`,
              classAPercent,
              "Write/list-multipart operations",
            );
          } else {
            addUnavailableRow("R2 Class A free tier", r2UsageObject.class_ops_error);
          }

          const classBUsed = asNumber(r2UsageObject.class_b_used_requests);
          const classBFree = asNumber(r2UsageObject.class_b_free_tier_requests);
          const classBPercent = asNumber(r2UsageObject.class_b_percent_of_free_tier);
          if (classBUsed !== null && classBFree !== null && classBPercent !== null) {
            addUsageRow(
              "R2 Class B free tier",
              `${formatCount(classBUsed)} / ${formatCount(classBFree)} (${Math.round(classBPercent)}%)`,
              classBPercent,
              "Read operations",
              r2LimitsResetLabel,
            );
          } else {
            addUnavailableRow("R2 Class B free tier", r2UsageObject.class_ops_error);
          }
        } else {
          addUnavailableRow("R2 usage", r2Error);
        }
        const r2UsageMarkup = `
          <div class="r2-usage-wrap">
            <div class="r2-window-heading">${escapeHtml(backupWindowLabel)}</div>
            ${r2Rows.join("")}
            <div class="r2-usage-meta">
              <div class="r2-usage-sub">R2 Metrics updated every hour. Last update: ${escapeHtml(r2LastUpdate)}</div>
              ${r2BackupWindowError ? `<div class="r2-usage-sub">Backup window source warning: ${escapeHtml(r2BackupWindowError)}</div>` : ""}
              <button class="settings-button r2-refresh-button" id="refresh-r2-metrics" type="button">Refresh R2 metrics</button>
            </div>
          </div>
        `;
        const sourceWarnings = [];
        if (dbSourceError) {
          sourceWarnings.push(`DB metrics source warning: ${dbSourceError}`);
        }
        if (schemaSourceError) {
          sourceWarnings.push(`Schema metrics source warning: ${schemaSourceError}`);
        }
        if (r2DomainSourceError) {
          sourceWarnings.push(`R2 domain metrics source warning: ${r2DomainSourceError}`);
        }
        const sourceWarningMarkup = sourceWarnings
          .map((message) => `<div class="footnote">${escapeHtml(message)}</div>`)
          .join("");

        panel.innerHTML = `
          <h2 class="panel-heading">
            <span>DB Cluster Size Trend</span>
            <div class="dispatch-filters">
              <label class="dispatch-filter" for="db-size-period-filter">
                Time period
                <select id="db-size-period-filter">
                  ${DB_SIZE_PERIOD_OPTIONS
                    .map((opt) => `<option value="${opt.value}" ${opt.value === dbSizePeriodHours ? "selected" : ""}>${opt.label}</option>`)
                    .join("")}
                </select>
              </label>
            </div>
          </h2>
          <div class="db-size-legend">
            <span class="db-size-item">
              <span class="db-size-item-title"><span class="db-size-swatch" style="background:#ff2d2d"></span>Ingest DB Cluster</span>
              <span class="db-size-item-min">${escapeHtml(ingestOldestDayLabel)}</span>
            </span>
            <span class="db-size-item">
              <span class="db-size-item-title"><span class="db-size-swatch" style="background:#3b82f6"></span>Observs &amp; AQI DB Cluster</span>
              <span class="db-size-item-min">uk_aq_observs ${escapeHtml(observsOldestDayLabel)}&nbsp;&nbsp;&nbsp;uk_aq_aqilevels ${escapeHtml(aqilevelsOldestDayLabel)}</span>
            </span>
          </div>
          <div class="db-size-chart-wrap">${chartMarkup}<div class="db-size-hover-tooltip" aria-hidden="true"></div></div>
          ${schemaChartMarkup}
          ${r2DomainChartMarkup}
          ${r2UsageMarkup}
          ${sourceWarningMarkup}
        `;

        bindDbSizeTooltips(panel);

        const periodSelect = panel.querySelector("#db-size-period-filter");
        if (periodSelect) {
          periodSelect.addEventListener("change", (event) => {
            const nextHours = Number(event.target.value);
            if (
              !Number.isFinite(nextHours) ||
              !DB_SIZE_PERIOD_OPTIONS.some((opt) => opt.value === nextHours)
            ) {
              return;
            }
            dbSizePeriodHours = nextHours;
            try {
              localStorage.setItem(DB_SIZE_PERIOD_STORAGE_KEY, String(dbSizePeriodHours));
            } catch (_err) {
              // Ignore storage write issues.
            }
            loadDashboard();
          });
        }

        const refreshR2Button = panel.querySelector("#refresh-r2-metrics");
        if (refreshR2Button) {
